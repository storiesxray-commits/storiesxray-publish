<style>

#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif}
canvas{position:absolute;left:0;top:0}

<div id="stage"><canvas id="c" width="1080" height="1920"></canvas>
<div class="ov" id="vig"></div><div class="ov" id="dark"></div><div class="ov" id="flash"></div><div class="ov" id="sep" style="background:radial-gradient(ellipse at 50% 45%, rgba(190,120,40,.16) 20%, rgba(40,20,5,.62) 100%);opacity:0"></div>
<div id="title"></div><div id="strike"></div><div id="cap"></div></div>
<script type="module">
import { THREE, W, H, clamp, ss, back } from './engine.js';
const V_ID = new URLSearchParams(location.search).get('v');
const SH = await import(`../videos/${V_ID}/shots.js`);
const timing = await (await fetch(`../out/${V_ID}/timing.json`)).json();
const sen = timing.sentences, st = i => sen[i - 1].start - 0.09, wd = (i, j) => sen[i - 1].words[j].s;

  const flush = () => { if (cur.length) { chunks.push({ s: cur[0].s, e: cur[cur.length - 1].e, words: cur.map(w => w.w) }); cur = []; } };
  for (const w of s.words) { if (cur.length && (cur.map(x => x.w).join(' ') + ' ' + w.w).replace(/[.,]/g, '').length > 12) flush(); cur.push(w); if (cur.length >= 3 || /[,.]$/.test(w.w)) flush(); }
  flush(); }
for (let i = 0; i < chunks.length - 1; i++) if (chunks[i + 1].s - chunks[i].e < 0.4) chunks[i].e = chunks[i + 1].s;

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const sh = shots.find(s => T >= s.start && T < s.end) || shots[shots.length - 1];

  if (sh.title && t >= sh.title.t0) { let t0 = sh.title.t0; for (const pt of (sh.title.pop || []).concat((sh.title.popFrac || []).map(p => p * d))) { if (t >= pt) t0 = pt; }
    const k = (t - t0) / 0.28; const html = sh.title.fn ? sh.title.fn(t, d) : sh.title.html; titleEl.innerHTML = html; titleEl.style.opacity = html ? 1 : 0; for (const sp of titleEl.querySelectorAll('span')) fit(sp, 800);
    titleEl.style.transform = `scale(${0.55 + 0.45 * back(k)}) rotate(${-2 + 0.6 * Math.sin(t * 2)}deg)`; }

  else capEl.style.opacity = 0;
  return sh.id;
};
window.READY = true;
