    <script>
      const X = window.XR, T = window.XR.tf;
      const R = X.rand(42);
      // shared defs once (gradients/filters used by every scene)

      { const st = document.createElement("style"); st.textContent = X.CAP_CSS; document.head.appendChild(st); }

      // ---------- build characters ----------
      const guy = { skin: "#f0bf96", skinD: "#d4936b", hair: "#3b2516", hairStyle: "short", shirt: "#e8573a", iris: "#3e6b2e" };

      X.put("s1mite", X.mite("m0", 0.62));
      X.put("s4ap", X.person("g2", 1.25, guy));
      X.put("s9p", X.person("g3", 1.45, guy));

      const s2m = [["m1", 478, 760, 0.7], ["m2", 604, 820, 0.68], ["m3", 488, 1150, 0.66], ["m4", 598, 1265, 0.62]];
      for (const [id, x, y, s] of s2m) X.put("s2m", `<g transform="translate(${x} ${y}) rotate(90)">${X.mite(id, s)}</g>`);
      X.put("s2side", `<g transform="translate(165 700) rotate(92)">${X.mite("ms1", 0.55)}</g><g transform="translate(935 660) rotate(88)">${X.mite("ms2", 0.55)}</g>`);

      X.put("s2cells", cells);

      X.put("s3m", X.mite("m5", 2.5));
      let bok = ""; for (let i = 0; i < 18; i++) bok += `<circle cx="${(R() * 1080).toFixed(0)}" cy="${(R() * 1920).toFixed(0)}" r="${(40 + R() * 90).toFixed(0)}" fill="#ffd9c8" opacity="${(0.08 + R() * 0.12).toFixed(2)}" filter="url(#soft)"/>`;
      X.put("s3bok", bok);
      const drops = [[990, 960, 50], [1020, 1130, 30], [900, 800, 26], [960, 1270, 36], [820, 1220, 22]];
      X.put("drops", drops.map((d, i) => `<g id="dr${i}" transform="translate(${d[0]} ${d[1]})"><circle r="${d[2]}" fill="url(#oil)" stroke="#9a6a10" stroke-width="5"/><ellipse cx="${-d[2] * 0.3}" cy="${-d[2] * 0.35}" rx="${d[2] * 0.28}" ry="${d[2] * 0.18}" fill="#fff" opacity=".8"/></g>`).join(""));

      let zz = ""; for (let i = 0; i < 3; i++) zz += `<text id="z${i}" x="0" y="0" font-size="${80 + i * 30}">Z</text>`;
      X.put("zzz", zz);

      const pores = (n, seed, col) => { const r = X.rand(seed); let s = ""; for (let i = 0; i < n; i++) { const x = r() * 1080, y = r() * 1920; s += `<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${(14 + r() * 10).toFixed(0)}" ry="${(9 + r() * 6).toFixed(0)}" fill="${col}"/><path d="M${x.toFixed(0)} ${y.toFixed(0)} q${(r() * 40 - 20).toFixed(0)} -60 ${(r() * 60 - 30).toFixed(0)} -120" stroke="#3a2416" stroke-width="5" fill="none" opacity=".55"/>`; } return s; };
      X.put("s4bpores", `<ellipse cx="300" cy="1150" rx="60" ry="34" fill="#4a1f1a"/><ellipse cx="800" cy="1060" rx="60" ry="34" fill="#4a1f1a"/>` + pores(26, 7, "#7e4038"));
      X.put("s4bm", `<g id="w6"><g transform="rotate(-8)">${X.mite("m6", 1.35)}</g></g><g id="w7"><g transform="scale(-1 1) rotate(-6)">${X.mite("m7", 1.35)}</g></g>`);
      let hs = ""; for (let i = 0; i < 6; i++) hs += `<path id="h${i}" d="M0 14 C-30 -6 -24 -38 0 -24 C24 -38 30 -6 0 14Z" fill="#ff5c86" stroke="#111" stroke-width="5" opacity="0"/>`;
      X.put("hearts", hs);

      X.put("s5pores", pores(30, 11, "#8a4a3a"));
      X.put("s5m", `<g id="w8" transform="translate(540 1200)">${X.mite("m8", 1.8, { glasses: true })}</g><g id="w9" transform="translate(-300 1500)"><g transform="rotate(-20)">${X.mite("m9", 0.9, { glasses: true })}</g></g><g id="w10" transform="translate(1380 900)"><g transform="scale(-1 1) rotate(-15)">${X.mite("m10", 0.9, { glasses: true })}</g></g>`);
      let mp = ""; for (let i = 0; i < 26; i++) mp += `<circle id="mp${i}" r="${(14 + R() * 22).toFixed(0)}" fill="url(#mel)" opacity="0"/>`;
      X.put("melp", mp);
      let tiles = ""; for (let a = 0; a < 6; a++) for (let b = 0; b < 6; b++) tiles += `<rect x="${-90 + a * 30}" y="${-90 + b * 30}" width="26" height="26" fill="#fff" opacity="${(0.2 + ((a * 7 + b * 3) % 5) * 0.15).toFixed(2)}"/>`;
      X.put("discoTiles", `<g clip-path="circle(92px at 0 0)">${tiles}</g>`);
      const bc = ["#ff3cac", "#2bd2ff", "#fff23a", "#7bff5a", "#a259ff", "#ff7a2b"];
      X.put("beams", bc.map((c, i) => `<path id="bm${i}" d="M540 120 L380 2000 L700 2000Z" fill="${c}" opacity=".32"/>`).join(""));

      X.put("board", X.mite("m11", 1.15));
      X.put("s6p", X.person("g4", 1, { skin: "#8d5a3b", skinD: "#6b3f26", hair: "#d8d8d8", hairStyle: "bald", shirt: "#ffffff", glasses: true, iris: "#2a1a10", beard: true }));

      let pl = ""; for (let i = 0; i < 22; i++) { const y = 260 + i * 70, w = 600 + ((i * 37) % 260); pl += `<path d="M${(1080 - w) / 2} ${y} H${(1080 + w) / 2}"/>`; }
      X.put("paper", `<path d="M200 170 H880" stroke="#8d8676" stroke-width="34"/>` + pl);
      X.put("s7m", X.mite("m12", 3));
      X.put("s7p", X.person("g5", 1, { skin: "#8d5a3b", skinD: "#6b3f26", hair: "#d8d8d8", hairStyle: "bald", shirt: "#ffffff", glasses: true, iris: "#2a1a10", beard: true }));

      const faces = [
        { skin: "#f6d0b1", hair: "#d9a441", hairStyle: "long", shirt: "#3aa76d" },
        { skin: "#6e4128", skinD: "#53301c", hair: "#1a0f08", hairStyle: "curly", shirt: "#e84a5f" },
        { skin: "#e8b48c", hair: "#2a1a10", hairStyle: "bun", shirt: "#4b6cff", glasses: true },
        { skin: "#c58c62", hair: "#111", hairStyle: "short", shirt: "#ff9f1c", beard: true },
        { skin: "#f2c6a8", hair: "#bbbbbb", hairStyle: "bald", shirt: "#7a4cff", glasses: true },
        { skin: "#a8724c", hair: "#3b1f10", hairStyle: "long", shirt: "#10a5a5" },

      const fpos = [[300, 640], [780, 640], [300, 940], [780, 940], [300, 1240], [780, 1240]];
      let rays = ""; for (let i = 0; i < 16; i++) rays += `<path d="M540 960 L${540 + Math.cos(i / 16 * 6.283) * 1600} ${960 + Math.sin(i / 16 * 6.283) * 1600} L${540 + Math.cos((i + 0.5) / 16 * 6.283) * 1600} ${960 + Math.sin((i + 0.5) / 16 * 6.283) * 1600}Z" fill="#ffe08a" opacity=".6"/>`;

      X.put("s8faces", faces.map((f, i) => `<g transform="translate(${fpos[i][0]} ${fpos[i][1]})"><g id="fc${i}" transform="scale(0)">

      const W = (t, a, b) => t >= a - 0.05 && t < b + 0.05;

      X.life((t) => {

          T("w7", `translate(${800 - meet * 40} ${1060 + meet * 30}) scale(${em.toFixed(3)})`);

          X.miteLife("m7", t, { walk: meet < 1 && meet > 0, phase: 2, lid: love * 0.85, blush: love, mouth: 0.2 + love * 0.3, gaze: [6, 0] });
          for (let i = 0; i < 6; i++) { const k = X.clamp((t - 12.8 - i * 0.08) / 0.6, 0, 1); X.attr(`h${i}`, "opacity", k > 0 && k < 1 ? (1 - k).toFixed(2) : 0); X.attr(`h${i}`, "transform", `translate(${545 + Math.sin(i * 2.1) * 140 * k} ${880 - k * 260 - i * 10}) scale(${0.6 + k * 0.6})`); }
        }
        if (W(t, 13.4, 18.4)) {
          const party = t >= tm(5, 12) - 0.02;
          const sip = X.sm(15.1, 15.4, t) - X.sm(16.65, 16.85, t);
          const wide = X.sm(16.1, 16.3, t);
          const shades = X.sm(16.7, 16.95, t);
          X.attr("m8-shades", "opacity", shades); X.attr("m9-shades", "opacity", party ? 1 : 0); X.attr("m10-shades", "opacity", party ? 1 : 0);
          X.miteLife("m8", t, { mouth: party ? 0.9 : sip > 0.5 ? 0.05 : 0.2 + wide * 0.6, pupil: 1 - wide * 0.4, gaze: sip > 0.5 ? [8, 0] : [0, 4], walk: party, bounce: party ? 9.2 : 0, phase: 1 });
          X.miteLife("m9", t, { walk: true, bounce: party ? 9.2 : 0, mouth: 0.8, phase: 3 });
          X.miteLife("m10", t, { walk: true, bounce: party ? 9.2 : 0, mouth: 0.8, phase: 5 });
          const ent = X.sm(17.1, 17.5, t);
          T("w9", `translate(${-300 + ent * 560} ${1520 - ent * 40})`);
          T("w10", `translate(${1380 - ent * 560} ${930})`);
          const cupS = X.sm(14.9, 15.2, t) * (1 - X.sm(16.6, 16.8, t));
          X.attr("cup", "opacity", cupS);
          X.attr("cup", "transform", `translate(${540 + 1.8 * 48 + 130} 1200)`);
          X.attr("cupb", "r", (70 * (1 - X.sm(15.4, 16.6, t) * 0.75)).toFixed(1));
          for (let i = 0; i < 26; i++) {
            const st = 14.4 + (i % 13) * 0.11, k = (t - st) / 2.6;
            const vis = k > 0 && k < 1;
            const x = 80 + ((i * 397) % 920), y = 1800 - k * 1500;
            const toM = X.sm(15.3, 16.5, t) * (i % 3 === 0 ? 1 : 0);
            X.attr(`mp${i}`, "opacity", vis ? (Math.sin(k * Math.PI) * 0.95).toFixed(2) : 0);
            X.attr(`mp${i}`, "transform", `translate(${(x + (730 - x) * toM).toFixed(1)} ${(y + (1200 - y) * toM).toFixed(1)})`);
          }
          const dusk = X.sm(14.3, 16.5, t);
          X.attr("s5dusk", "opacity", party ? 0.55 : dusk * 0.45);
          if (party) {
            const b = Math.floor((t - 17.18) / 0.22) % 4;
            X.attr("s5bg", "fill", ["#7a2bd1", "#d12b9a", "#2b6fd1", "#16a39a"][b]);
            X.attr("beams", "opacity", 1);
            for (let i = 0; i < 6; i++) X.attr(`bm${i}`, "transform", `rotate(${Math.sin(t * 2.4 + i * 1.1) * 38 + (i - 2.5) * 12} 540 120)`);
            T("disco", `translate(540 ${-200 + X.sm(17.18, 17.5, t) * 420}) rotate(${(t - 17.18) * 90})`);
          } else { X.attr("s5bg", "fill", "#d7866a"); X.attr("beams", "opacity", 0); T("disco", "translate(540 -300)"); }
        }
        if (W(t, 18.4, 21.95)) {
          const shake = t > 19.85 && t < 20.9 ? Math.sin((t - 19.85) * 18) * 9 : 0;
          const smug = X.sm(19.8, 20.1, t);
          X.personLife("g4", t, { tilt: shake, lid: smug * 0.75, smile: 0.5 + smug * 0.4, open: t > 21.0 ? 0.2 : 0, brow: smug > 0.5 ? -0.4 : 0.3, gaze: [16, -2], phase: 0.4 });
          X.miteLife("m11", t, { phase: 4, mouth: 0.1 });
        }
        if (W(t, 21.95, 25.17)) {
          const jaw = X.sm(24.2, 24.4, t);
          X.personLife("g5", t, { open: jaw * 0.95, smile: 0.4 - jaw * 0.8, brow: jaw, pupil: 1 - jaw * 0.45, gaze: [0, -6], phase: 1.1 });
          X.miteLife("m12", t, { phase: 2, mouth: 0.2 });
        }
        if (W(t, 25.17, 27.97)) {
          for (let i = 0; i < 6; i++) X.personLife("f" + i, t, { phase: i * 0.9, open: X.sm(26.9 + i * 0.05, 27.1 + i * 0.05, t) * 0.5, smile: 0.5 - X.sm(26.9, 27.1, t) * 0.6, brow: X.sm(26.9, 27.1, t) * 0.8, gaze: [i % 2 ? -12 : 12, -12] });
          for (let i = 0; i < 6; i++) X.miteLife("fmm" + i, t, { phase: i, mouth: 0.6 });
          T("raysR", `rotate(${(t - 25.17) * 12} 540 960)`);
        }
        if (W(t, 27.97, 31.2)) {
          const shock = X.sm(29.3, 29.5, t);
          const nod = t > 27.98 && t < 28.5 ? Math.sin((t - 27.98) * 12) * 4 : 0;
          X.personLife("g3", t, { noBlink: t > 30.5, gaze: shock > 0.5 ? [0, 0] : [0, 2], brow: shock, open: shock * 0.85, smile: 0.4 - shock * 0.9, pupil: 1 - shock * 0.4, tilt: nod });
          const peek = X.sm(29.6, 30.0, t);
          X.miteLife("m13", t, { phase: 1, mouth: 0.55, lid: t > 30.4 && t < 30.6 ? 1 : 0, gaze: [0, 5] });
          T("s9mwrap", `translate(${540 + 1.45 * 64} ${1010 + 1.45 * (-120) - peek * 40}) scale(${peek.toFixed(3)})`);
        }
      });

      // ---------- camera + text timeline ----------
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: 31.2, duration: 31.2, ease: "none", onUpdate: () => X.tick(clock.t) }, 0);
      const pop = (sel, at, from = 0.4) => tl.fromTo(sel, { scale: from, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: "back.out(2.6)" }, at);
      // S1
      tl.fromTo("#s1cam", { scale: 1, svgOrigin: "720 1100" }, { scale: 1.12, svgOrigin: "720 1100", duration: 2.55, ease: "sine.inOut" }, 0);
      tl.to("#s1cam", { scale: 6, svgOrigin: "760 1170", duration: 0.5, ease: "power3.in" }, 2.55);
      tl.fromTo("#c1", { scale: 1 }, { scale: 1.06, duration: 2.4, ease: "sine.inOut" }, 0); tl.fromTo("#c1b", { scale: 1, color: "#ffd400" }, { scale: 1.12, duration: 0.2, ease: "back.out(3)" }, 2.23); tl.to("#c1", { opacity: 0, duration: 0.15 }, 2.45);
      // S2
      tl.fromTo("#s2cam", { scale: 2.3, svgOrigin: "540 560" }, { scale: 1, svgOrigin: "540 560", duration: 1.0, ease: "power3.out" }, 3.05);
      tl.to("#s2cam", { y: -260, duration: 3.8, ease: "sine.inOut" }, 4.05);
      tl.fromTo("#lab1", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 4.0);
      tl.fromTo("#lab2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.25, ease: "back.out(2)" }, 3.9);
      tl.to("#lab1", { opacity: 0, duration: 0.2 }, 5.0);
      tl.to("#lab2", { opacity: 0, duration: 0.2 }, 5.1);
      tl.fromTo("#lab3", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 5.48);
      // S3
      tl.fromTo("#s3cam", { scale: 1.12, svgOrigin: "700 1000" }, { scale: 1.0, svgOrigin: "700 1000", duration: 2.7, ease: "sine.out" }, 7.91);
      tl.fromTo("#clk", { opacity: 0, scale: 0.4, svgOrigin: "230 420" }, { opacity: 1, scale: 1, svgOrigin: "230 420", duration: 0.3, ease: "back.out(2.4)" }, 7.95);
      tl.fromTo("#lab4", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(2)" }, 9.54);
      // S4a / S4b
      tl.fromTo("#s4acam", { scale: 1, svgOrigin: "520 1080" }, { scale: 1.6, svgOrigin: "560 1010", duration: 1.04, ease: "power2.in" }, 10.63);
      tl.fromTo("#s4bcam", { scale: 1.35, svgOrigin: "550 1050" }, { scale: 1.0, svgOrigin: "550 1000", duration: 1.0, ease: "power2.out" }, 11.66);
      tl.fromTo("#heart", { scale: 0, svgOrigin: "0 0" }, { scale: 1.25, svgOrigin: "0 0", duration: 0.3, ease: "back.out(3)" }, 12.74);
      tl.to("#heart", { scale: 1, duration: 0.2, ease: "sine.inOut" }, 13.04);
      // S5
      tl.fromTo("#s5cam", { scale: 1.08, svgOrigin: "540 1100" }, { scale: 1, svgOrigin: "540 1100", duration: 3.7, ease: "sine.out" }, 13.4);
      tl.fromTo("#meltxt", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, 14.52);
      tl.to("#meltxt", { opacity: 0, duration: 0.2 }, 17.0);
      tl.fromTo("#s5cam", { x: 0 }, { x: 0, keyframes: [{ x: -14, duration: 0.05 }, { x: 12, duration: 0.05 }, { x: 0, duration: 0.06 }] }, 17.18);
      pop("#c5a", 17.59);
      // S6
      tl.fromTo("#s6cam", { scale: 1, svgOrigin: "540 1000" }, { scale: 1.1, svgOrigin: "700 1050", duration: 3.5, ease: "sine.inOut" }, 18.4);
      tl.fromTo("#qmark", { opacity: 0, scale: 0.2, svgOrigin: "800 1250" }, { opacity: 1, scale: 1, svgOrigin: "800 1250", duration: 0.3, ease: "back.out(3)" }, 20.9);
      pop("#c6a", 21.06, 1.8);
      // S7
      tl.fromTo("#stamp", { scale: 3.2, opacity: 0, rotation: -18, svgOrigin: "0 0" }, { scale: 1, opacity: 1, rotation: -8, svgOrigin: "0 0", duration: 0.18, ease: "power4.in" }, 22.12);
      tl.fromTo("#s7cam", { x: 0, y: 0 }, { keyframes: [{ x: -22, y: 14, duration: 0.04 }, { x: 18, y: -10, duration: 0.05 }, { x: -8, y: 6, duration: 0.05 }, { x: 0, y: 0, duration: 0.06 }] }, 22.3);
      tl.to("#stamp", { scale: 1.08, rotation: -5, svgOrigin: "0 0", duration: 0.95, ease: "sine.inOut" }, 22.32);
      tl.fromTo("#paper", { scale: 1, svgOrigin: "540 960" }, { scale: 1.07, svgOrigin: "540 960", duration: 1.4, ease: "sine.inOut" }, 21.95);
      tl.to("#stamp", { opacity: 0, duration: 0.15 }, 23.3);
      tl.fromTo("#scopeG", { opacity: 0 }, { opacity: 1, duration: 0.18 }, 23.35);
      tl.fromTo("#s7zoom", { scale: 1, svgOrigin: "540 1000" }, { scale: 2.6, svgOrigin: "540 1000", duration: 0.55, ease: "power3.inOut" }, 24.15);
      tl.fromTo("#ring", { opacity: 0, scale: 2.5, svgOrigin: "540 1000" }, { opacity: 1, scale: 1, svgOrigin: "540 1000", duration: 0.22, ease: "back.out(2)" }, 24.7);
      tl.fromTo("#s7p", { opacity: 0, y: 200 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.8)" }, 23.9);
      pop("#c7a", 24.73);
      // S8
      for (let i = 0; i < 6; i++) tl.fromTo(`#fc${i}`, { scale: 0.55, svgOrigin: "0 0" }, { scale: 1, svgOrigin: "0 0", duration: 0.3, ease: "back.out(2.2)" }, 25.17 + i * 0.07);
      for (let i = 0; i < 6; i++) tl.fromTo(`#fm${i}`, { scale: 0, svgOrigin: "0 0" }, { scale: 1, svgOrigin: "0 0", duration: 0.25, ease: "back.out(3)" }, 26.9 + i * 0.07);
      pop("#c8a", 25.77); pop("#c8b", 26.13);
      // S9
      tl.fromTo("#s9cam", { scale: 1, svgOrigin: "540 960" }, { scale: 1, svgOrigin: "540 960", duration: 0.01 }, 27.97);
      tl.to("#s9cam", { scale: 1.32, svgOrigin: "600 900", duration: 0.35, ease: "power3.out" }, 28.86);
      tl.to("#s9cam", { scale: 1.45, svgOrigin: "600 900", duration: 1.6, ease: "sine.out" }, 29.3);
      pop("#c9a", 29.0); pop("#c9b", 29.34, 1.8);
      // cut flashes
      [3.05, 21.95, 25.17].forEach((at, i) => tl.fromTo("#flash", { opacity: 0.55 }, { opacity: 0, duration: 0.18, ease: "power2.out", immediateRender: false }, at));
      // film grain boils at 12 fps
      const gr = { k: 0 };
      tl.to(gr, { k: 31.2, duration: 31.2, ease: "none", onUpdate: () => { const f = Math.floor(gr.k * 12); document.getElementById("grain").style.backgroundPosition = `${(f * 137) % 400}px ${(f * 251) % 400}px`; } }, 0);
      window.__timelines["main"] = tl;
      X.tick(0);
      tl.seek(0);
    </script>
