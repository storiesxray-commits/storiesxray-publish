<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/timing.js"></script>
    <script src="assets/lib.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #2a1a10; }
      #root { position: relative; width: 100%; height: 100%; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .cap { position: absolute; left: 0; width: 1080px; text-align: center; z-index: 20; }
      .ln { display: block; font-family: "Anton"; font-size: 150px; line-height: 1.0; color: #fff; -webkit-text-stroke: 14px #1a0f08;
            paint-order: stroke fill; text-shadow: 0 10px 0 rgba(0,0,0,.4), 0 0 40px rgba(255,160,40,.35); letter-spacing: 1px; }
      .ln.y { color: #ffb020; } .ln.r { color: #ff4d4d; } .ln.sm { font-size: 108px; }
      #grain { position: absolute; inset: 0; z-index: 30; opacity: .05; mix-blend-mode: overlay; background: url(assets/grain.png); }
      #vig { position: absolute; inset: 0; z-index: 29; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 50%, rgba(20,8,0,.55) 100%); }
      #flash { position: absolute; inset: 0; z-index: 31; background: #fff; opacity: 0; }
      html.clean .cap, html.clean #subs, html.clean .ttl { opacity: 0 !important; }
    </style>
  </head>
  <body>
    <svg id="gdefs" width="0" height="0" style="position:absolute"><g id="defsHost"></g>
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a4a"/><stop offset=".55" stop-color="#ffc27a"/><stop offset="1" stop-color="#ffe6b8"/></linearGradient>
        <linearGradient id="skyDoom" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1a2a"/><stop offset=".6" stop-color="#9a4a3a"/><stop offset="1" stop-color="#e8a060"/></linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a5660"/><stop offset="1" stop-color="#2e2c34"/></linearGradient>
        <linearGradient id="carG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a5a"/><stop offset=".5" stop-color="#e02a2a"/><stop offset="1" stop-color="#8a1414"/></linearGradient>
        <linearGradient id="truckG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a7a8a"/><stop offset=".5" stop-color="#3a4a5a"/><stop offset="1" stop-color="#1a242e"/></linearGradient>
        <linearGradient id="furG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a4426"/><stop offset=".6" stop-color="#4a2e18"/><stop offset="1" stop-color="#2e1c0e"/></linearGradient>
        <linearGradient id="glassG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfefff" stop-opacity=".55"/><stop offset=".5" stop-color="#9fd8ff" stop-opacity=".2"/><stop offset="1" stop-color="#cfefff" stop-opacity=".45"/></linearGradient>
        <radialGradient id="sunG" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff2c0"/><stop offset=".45" stop-color="#ffd27a" stop-opacity=".7"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
        <radialGradient id="blinkG" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6c0"/><stop offset=".35" stop-color="#ffb020"/><stop offset="1" stop-color="#ffb020" stop-opacity="0"/></radialGradient>
        <filter id="ds" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
        <filter id="bgBlur"><feGaussianBlur stdDeviation="5"/></filter>
        <clipPath id="winC" clipPathUnits="userSpaceOnUse"><path d="M-70 -200 L-40 -295 C-30 -310 -10 -312 20 -312 L110 -312 C140 -312 158 -305 170 -290 L240 -200 Z"/></clipPath><clipPath id="winT" clipPathUnits="userSpaceOnUse"><path d="M-20 -270 L-10 -395 C0 -408 20 -410 40 -410 L150 -410 C180 -410 200 -400 212 -385 L270 -270 Z"/></clipPath>
        <filter id="hblur" x="-20%" y="-10%" width="140%" height="120%"><feGaussianBlur stdDeviation="10 0"/></filter>
      </defs>
    </svg>
    <div id="root" data-composition-id="main" data-start="0" data-duration="23.01" data-width="1080" data-height="1920">

      <!-- S1 the model driver, blinker on, sunset highway -->
      <div id="s1" class="clip scene" data-start="0" data-duration="2.75" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s1cam">
          <rect width="1080" height="1920" fill="url(#sky)"/><circle cx="760" cy="980" r="320" fill="url(#sunG)"/>
          <g id="mesa1" filter="url(#bgBlur)"></g>
          <rect y="1240" width="1080" height="680" fill="url(#road)"/>
          <g id="dash1"></g>
          <g transform="translate(560 1640)"><g id="car1"></g></g>
        </g></svg>
      </div>

      <!-- S2 top-down: signals every single lane change -->
      <div id="s2" class="clip scene" data-start="2.75" data-duration="3.3" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s2cam">
          <rect width="1080" height="1920" fill="#3a3842"/>
          <rect x="0" width="70" height="1920" fill="#c9a36a"/><rect x="1010" width="70" height="1920" fill="#c9a36a"/>
          <path d="M70 0 V1920 M1010 0 V1920" stroke="#f4f1ea" stroke-width="12"/>
          <g id="lanes2"></g>
          <g id="car2p"><g id="car2"></g></g>
        </g></svg>
      </div>

      <!-- S3 a bison charges your car -->
      <div id="s3" class="clip scene" data-start="6.05" data-duration="2.75" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s3cam">
          <rect width="1080" height="1920" fill="url(#skyDoom)"/>
          <g id="mesa3" filter="url(#bgBlur)"></g>
          <rect y="1240" width="1080" height="680" fill="url(#road)"/>
          <g id="dash3"></g>
          <g transform="translate(330 1640)"><g id="car3"></g></g>
          <g id="dust3"></g>
          <g id="bis3p"><g id="bis3"></g></g>
          <g id="spd3" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".55"></g>
        </g></svg>
      </div>

      <!-- S4 stats: 2,000 lb / 35 mph -->
      <div id="s4" class="clip scene" data-start="8.8" data-duration="4.15" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s4cam">
          <rect width="1080" height="1920" fill="url(#skyDoom)"/>
          <g id="rays4" opacity=".25"></g>
          <g transform="translate(540 1090)"><g id="bis4"></g></g>
          <g transform="translate(540 560)"><g id="lb4" class="ttl"><rect x="-370" y="-95" width="740" height="175" rx="26" fill="#1a0f08" stroke="#ffb020" stroke-width="8"/><text id="lb4t" y="45" text-anchor="middle" font-family="Anton" font-size="124" fill="#ffb020">0 LB</text></g></g>
          <g transform="translate(540 1300) scale(0.72)"><g id="gauge4" class="ttl">
            <circle r="210" fill="#1a0f08" stroke="#f4f1ea" stroke-width="12"/>
            <g id="ticks4"></g>
            <text y="150" text-anchor="middle" font-family="Anton" font-size="62" fill="#ffb020" id="mph4">0 MPH</text>
            <g id="needle4"><path d="M-10 0 L0 -170 L10 0Z" fill="#ff4d4d" stroke="#1a0f08" stroke-width="4"/></g><circle r="24" fill="#f4f1ea" stroke="#1a0f08" stroke-width="6"/></g></g>
        </g></svg>
      </div>

      <!-- S5 impact: car on its roof, wheels spinning, bison chewing -->
      <div id="s5" class="clip scene" data-start="12.95" data-duration="2.0" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s5cam">
          <rect width="1080" height="1920" fill="url(#skyDoom)"/>
          <g id="mesa5" filter="url(#bgBlur)"></g>
          <rect y="1240" width="1080" height="680" fill="url(#road)"/>
          <g id="flip5p"><g id="car5"></g></g>
          <g transform="translate(820 1700) scale(-0.62 0.62)"><g id="bis5"></g></g>
          <g id="dust5"></g>
          <g id="stars5"></g>
        </g></svg>
      </div>

      <!-- S6 top-down: the no-blinker guy, swerving everywhere -->
      <div id="s6" class="clip scene" data-start="14.95" data-duration="2.9" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s6cam">
          <rect width="1080" height="1920" fill="#3a3842"/>
          <rect x="0" width="70" height="1920" fill="#c9a36a"/><rect x="1010" width="70" height="1920" fill="#c9a36a"/>
          <path d="M70 0 V1920 M1010 0 V1920" stroke="#f4f1ea" stroke-width="12"/>
          <g id="lanes6"></g>
          <g id="oth6"></g>
          <g id="trk6p"><g id="trk6"></g></g>
          <g id="honk6"></g>
        </g></svg>
      </div>

      <!-- S7 same bison (side view, the lifted truck, the tiny driver) -->
      <div id="s7" class="clip scene" data-start="17.85" data-duration="2.15" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s7cam">
          <rect width="1080" height="1920" fill="url(#skyDoom)"/>
          <g id="mesa7" filter="url(#bgBlur)"></g>
          <rect y="1240" width="1080" height="680" fill="url(#road)"/>
          <g id="trk7p"><g id="trk7"></g></g>
          <g id="bis7p"><g id="bis7"></g></g>
          <g id="dust7"></g>
        </g></svg>
      </div>

      <!-- S8 (whisper) the bison walks off... and signals -->
      <div id="s8" class="clip scene" data-start="20.0" data-duration="3.01" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s8cam">
          <rect width="1080" height="1920" fill="url(#sky)"/><circle cx="300" cy="1050" r="300" fill="url(#sunG)"/>
          <g id="mesa8" filter="url(#bgBlur)"></g>
          <rect y="1240" width="1080" height="680" fill="url(#road)"/>
          <g id="sign8" transform="translate(180 1250)"><rect x="-8" y="0" width="16" height="-1" fill="#888"/></g>
          <g id="bis8p"><g id="bis8"></g></g>
        </g></svg>
      </div>

      <div id="c1" class="clip cap" data-start="0" data-duration="2.75" data-track-index="1" style="top:300px"><span id="c1a" class="ln y">BLINKER: ON</span></div>
      <div id="c2" class="clip cap" data-start="4.1" data-duration="1.95" data-track-index="1" style="top:300px"><span id="c2a" class="ln sm" style="display:inline-block;background:rgba(8,6,4,.6);padding:8px 28px;border-radius:28px">EVERY. SINGLE. TIME.</span></div>
      <div id="c5" class="clip cap" data-start="13.1" data-duration="1.85" data-track-index="1" style="top:300px"><span id="c5a" class="ln r">R.I.P.</span></div>
      <div id="c6" class="clip cap" data-start="16.0" data-duration="1.85" data-track-index="1" style="top:150px"><span id="c6a" class="ln r sm" style="display:inline-block;background:rgba(8,6,4,.6);padding:8px 28px;border-radius:28px">BLINKER: NEVER</span></div>
      <div id="c8" class="clip cap" data-start="20.8" data-duration="2.21" data-track-index="1" style="top:300px"><span id="c8a" class="ln y">IT SIGNALED.</span></div>

      <audio id="mix" class="clip" data-start="0" data-duration="23.01" data-track-index="2" data-volume="1" src="assets/mix.wav"></audio>
      <div id="subs"></div>
      <div id="vig"></div>
      <div id="grain"></div>
      <div id="flash"></div>
    </div>

    <script>
      const X = window.XR, T = X.tf;
      document.getElementById("defsHost").outerHTML = X.defs();
      { const st = document.createElement("style"); st.textContent = X.CAP_CSS; document.head.appendChild(st); }
      const w = (s, i) => window.TIMING[s][i];
      const C = [0, 2.75, 6.05, 8.8, 12.95, 14.95, 17.85, 20.0, 23.01];
      X.captions({ capY: (t) => (t < C[1] ? 560 : t < C[2] ? 1380 : t < C[3] ? 560 : t < C[4] ? 330 : t < C[5] ? 560 : t < C[6] ? 1400 : t < C[7] ? 560 : 560) });

      // ---------- props (own drawings) ----------
      const OL = "#1a0f08";
      // side-view sedan facing right; base (wheel bottom) at y=0; driver figure sits behind the body
      const car = (id, fill = "url(#carG)") => `<g id="${id}" filter="url(#ds)">
        <path d="M-330 -70 C-340 -150 -300 -180 -230 -185 L-150 -190 L-90 -300 C-70 -325 -40 -330 20 -330 L120 -330 C160 -330 180 -320 200 -300 L270 -200 L320 -190 C360 -180 370 -150 365 -70 Z" fill="${fill}" stroke="${OL}" stroke-width="10" stroke-linejoin="round"/>
        <path d="M-70 -200 L-40 -295 C-30 -310 -10 -312 20 -312 L110 -312 C140 -312 158 -305 170 -290 L240 -200 Z" fill="#20303e" stroke="${OL}" stroke-width="7"/>
        <g clip-path="url(#winC)"><g id="${id}-drv"></g></g>
        <path d="M-70 -200 L-40 -295 C-30 -310 -10 -312 20 -312 L110 -312 C140 -312 158 -305 170 -290 L240 -200 Z" fill="url(#glassG)" stroke="${OL}" stroke-width="7"/>
        <path d="M70 -312 V-200" stroke="${OL}" stroke-width="10"/>
        <path d="M-320 -130 H350" stroke="#fff" stroke-width="5" opacity=".35"/>
        <rect x="330" y="-170" width="34" height="26" rx="6" fill="#fff6c0" stroke="${OL}" stroke-width="5"/>
        <g id="${id}-blk"><circle cx="-325" cy="-150" r="60" fill="url(#blinkG)"/><rect x="-342" y="-166" width="26" height="30" rx="6" fill="#ffb020" stroke="${OL}" stroke-width="5"/></g>
        <g id="${id}-blkOff"><rect x="-342" y="-166" width="26" height="30" rx="6" fill="#8a5a1a" stroke="${OL}" stroke-width="5"/></g>
        ${[-200, 210].map((x, k) => `<g transform="translate(${x} -55)"><g id="${id}-wh${k}"><circle r="62" fill="#18161c" stroke="${OL}" stroke-width="8"/><circle r="30" fill="#c9ccd2" stroke="${OL}" stroke-width="5"/><path d="M-30 0 H30 M0 -30 V30" stroke="${OL}" stroke-width="5"/></g></g>`).join("")}
      </g>`;
      // lifted pickup (the no-blinker guy's) facing right
      const truck = (id) => `<g id="${id}" filter="url(#ds)">
        <path d="M-380 -150 L-380 -260 L-60 -260 L-40 -400 C-30 -420 0 -425 40 -425 L160 -425 C200 -425 220 -410 240 -380 L300 -270 L380 -255 C410 -245 420 -220 415 -150 Z" fill="url(#truckG)" stroke="${OL}" stroke-width="10" stroke-linejoin="round"/>
        <path d="M-20 -270 L-10 -395 C0 -408 20 -410 40 -410 L150 -410 C180 -410 200 -400 212 -385 L270 -270 Z" fill="#20303e" stroke="${OL}" stroke-width="7"/>
        <g clip-path="url(#winT)"><g id="${id}-drv"></g></g>
        <path d="M-20 -270 L-10 -395 C0 -408 20 -410 40 -410 L150 -410 C180 -410 200 -400 212 -385 L270 -270 Z" fill="url(#glassG)" stroke="${OL}" stroke-width="7"/>
        <rect x="-380" y="-150" width="800" height="40" fill="#1a242e" stroke="${OL}" stroke-width="8"/>
        <path d="M-370 -200 H-80 M300 -220 H405" stroke="#ff4d4d" stroke-width="12"/>
        <rect x="-392" y="-240" width="22" height="34" rx="5" fill="#5a3a12" stroke="${OL}" stroke-width="5"/>
        ${[-250, 270].map((x, k) => `<g transform="translate(${x} -90)"><g id="${id}-wh${k}"><circle r="95" fill="#18161c" stroke="${OL}" stroke-width="9"/><circle r="45" fill="#8a9098" stroke="${OL}" stroke-width="6"/><path d="M-45 0 H45 M0 -45 V45" stroke="${OL}" stroke-width="6"/></g></g>`).join("")}
      </g>`;
      // bison facing right, hooves at y=0, ~900 wide
      const bison = (id) => `<g id="${id}" filter="url(#ds)">
        ${[["lb", -260], ["lf", 170]].map(([n, x]) => `<g transform="translate(${x} -150)"><g id="${id}-${n}"><path d="M-30 0 L-26 140 L26 140 L30 0Z" fill="#2e1c0e" stroke="${OL}" stroke-width="8"/><rect x="-34" y="130" width="68" height="28" rx="8" fill="#14100c" stroke="${OL}" stroke-width="6"/></g></g>`).join("")}
        <path d="M-380 -260 C-420 -330 -380 -420 -280 -430 C-160 -440 -60 -560 80 -560 C200 -560 280 -480 300 -380 C320 -300 300 -200 240 -150 L-300 -150 C-360 -160 -380 -200 -380 -260Z" fill="url(#furG)" stroke="${OL}" stroke-width="10" stroke-linejoin="round"/>
        <path d="M-370 -280 C-410 -270 -440 -240 -450 -200" fill="none" stroke="${OL}" stroke-width="12" stroke-linecap="round"/><circle cx="-452" cy="-196" r="16" fill="#2e1c0e" stroke="${OL}" stroke-width="5"/>
        <path d="M-60 -540 C20 -600 160 -600 240 -520 C300 -460 330 -380 310 -300 C260 -330 200 -320 160 -300 C100 -380 20 -440 -60 -540Z" fill="#7a5230" stroke="${OL}" stroke-width="9" stroke-linejoin="round"/>
        ${[...Array(9)].map((_, i) => `<path d="M${-40 + i * 38} ${-520 + Math.abs(i - 4) * 18} q14 -26 30 0" fill="none" stroke="#9a6a3e" stroke-width="7" stroke-linecap="round"/>`).join("")}
        <g id="${id}-head" transform="translate(300 -330)">
          <path d="M-60 -110 C40 -140 140 -90 160 0 C170 60 150 120 110 140 C60 160 0 150 -30 110 C-80 60 -100 -40 -60 -110Z" fill="#3a2414" stroke="${OL}" stroke-width="10" stroke-linejoin="round"/>
          <path d="M-20 90 C-10 170 60 200 100 160 C80 130 30 120 -20 90Z" fill="#5a3a20" stroke="${OL}" stroke-width="7"/>
          <path d="M-10 -100 C-30 -160 10 -190 40 -170 C20 -150 10 -130 20 -105" fill="#e8dcc0" stroke="${OL}" stroke-width="7" stroke-linejoin="round"/>
          <path d="M90 -100 C110 -150 150 -160 165 -130 C140 -125 125 -110 120 -90" fill="#e8dcc0" stroke="${OL}" stroke-width="7" stroke-linejoin="round"/>
          <ellipse cx="135" cy="70" rx="26" ry="18" fill="#1a0f08"/><circle cx="128" cy="66" r="6" fill="#4a3020"/>
          <g transform="translate(70 -20)"><ellipse rx="22" ry="20" fill="#fff" stroke="${OL}" stroke-width="5"/><circle id="${id}-pup" cx="6" r="11" fill="${OL}"/><path id="${id}-brow" d="M-26 -30 L26 -18" stroke="${OL}" stroke-width="9" stroke-linecap="round"/></g>
        </g>
        ${[["rb", -180], ["rf", 230]].map(([n, x]) => `<g transform="translate(${x} -150)"><g id="${id}-${n}"><path d="M-32 0 L-28 140 L28 140 L32 0Z" fill="#3a2414" stroke="${OL}" stroke-width="8"/><rect x="-36" y="130" width="72" height="28" rx="8" fill="#14100c" stroke="${OL}" stroke-width="6"/></g></g>`).join("")}
        <g id="${id}-blk" opacity="0" transform="translate(-395 -290) scale(-1.7 1.7)"><circle r="100" fill="url(#blinkG)"/><path d="M-34 0 L0 -30 L0 -14 L30 -14 L30 14 L0 14 L0 30Z" fill="#ffb020" stroke="${OL}" stroke-width="6" stroke-linejoin="round"/></g>
      </g>`;
      // top-down cars
      const topCar = (id, c, L = 300, W = 150, blk = true) => `<g id="${id}" filter="url(#ds)"><rect x="${-W / 2}" y="${-L / 2}" width="${W}" height="${L}" rx="40" fill="${c}" stroke="${OL}" stroke-width="9"/>
        <rect x="${-W / 2 + 18}" y="${-L / 2 + 60}" width="${W - 36}" height="70" rx="16" fill="#20303e"/><rect x="${-W / 2 + 22}" y="${L / 2 - 100}" width="${W - 44}" height="50" rx="14" fill="#20303e"/>
        <rect x="${-W / 2 + 14}" y="${-L / 2 + 140}" width="${W - 28}" height="${L - 260}" rx="12" fill="#fff" opacity=".12"/>
        ${blk ? ["L", "R"].map((s) => [-1, 1].map((e) => `<g id="${id}-b${s}${e > 0 ? "r" : "f"}" opacity="0"><circle cx="${(s === "L" ? -1 : 1) * W / 2}" cy="${e * (L / 2 - 20)}" r="55" fill="url(#blinkG)"/><rect x="${(s === "L" ? -1 : 1) * W / 2 - 14}" y="${e * (L / 2 - 20) - 14}" width="28" height="28" rx="6" fill="#ffb020" stroke="${OL}" stroke-width="4"/></g>`).join("")).join("") : ""}</g>`;
      const mesa = `<path d="M0 1240 V1060 L120 1060 L160 1000 L360 1000 L400 1080 L560 1080 L600 960 L820 960 L860 1060 L1080 1060 V1240Z" fill="#b05a3a" opacity=".85"/>
        <path d="M0 1240 V1150 C200 1120 400 1170 600 1140 C800 1110 950 1150 1080 1130 V1240Z" fill="#8a4a2e"/>
        ${[[90, 1210], [700, 1200], [980, 1215]].map(([x, y]) => `<g transform="translate(${x} ${y})"><path d="M0 0 V-110 M0 -60 H-30 V-90 M0 -50 H28 V-80" stroke="#3a6a3a" stroke-width="22" stroke-linecap="round" fill="none"/></g>`).join("")}`;
      ["mesa1", "mesa3", "mesa5", "mesa7", "mesa8"].forEach((id) => X.put(id, mesa));
      const dashes = (id) => X.put(id, [...Array(8)].map((_, i) => `<rect id="${id}_${i}" y="1450" width="140" height="18" fill="#f4f1ea" opacity=".85"/>`).join(""));
      dashes("dash1"); dashes("dash3");
      X.put("car1", car("cr1")); X.put("car3", car("cr3")); X.put("car5", car("cr5"));
      X.put("trk7", truck("tk7"));
      ["bis3", "bis4", "bis5", "bis7", "bis8"].forEach((id) => X.put(id, bison(id + "b")));
      X.put("car2", topCar("tc2", "url(#carG)")); X.put("trk6", topCar("tt6", "#2a3a5a", 360, 170, false) + `<g transform="translate(0 20)"><rect x="-80" y="-44" width="160" height="70" rx="16" fill="#ff3b30" stroke="${OL}" stroke-width="6"/><text y="12" text-anchor="middle" font-family="Anton" font-size="56" fill="#fff">YOU</text></g>`);
      X.put("oth6", [["#f2c230", 380], ["#2f8a5a", 760], ["#9a9aa8", 380], ["#e8e0d0", 760]].map(([c, x], i) => `<g id="ot${i}">${topCar("oc" + i, c, 280, 140, false)}</g>`).join(""));
      X.put("honk6", [...Array(4)].map((_, i) => `<g id="hk${i}" opacity="0"><text font-family="Anton" font-size="78" fill="#ffb020" stroke="${OL}" stroke-width="8" paint-order="stroke" text-anchor="middle">HONK!</text></g>`).join(""));
