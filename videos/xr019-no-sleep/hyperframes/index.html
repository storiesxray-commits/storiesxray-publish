<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/timing.js"></script>
    <script src="assets/lib.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #071414; }
      #root { position: relative; width: 100%; height: 100%; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .cap { position: absolute; left: 0; width: 1080px; text-align: center; z-index: 20; }
      .ln { display: block; font-family: "Anton"; font-size: 140px; line-height: 1.0; color: #fff; -webkit-text-stroke: 14px #061010;
            paint-order: stroke fill; text-shadow: 0 10px 0 rgba(0,0,0,.4); letter-spacing: 1px; }
      .ln.hi { color: #b6ff6e; } .ln.red { color: #ff4d4d; } .ln.sun { color: #ffcf3a; } .ln.sm { font-size: 96px; }
      #grain { position: absolute; inset: 0; z-index: 30; opacity: .1; mix-blend-mode: overlay; background: url(assets/grain.png); }
      #vig { position: absolute; inset: 0; z-index: 29; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 50%, rgba(0,10,10,.55) 100%); }
      #flash { position: absolute; inset: 0; z-index: 31; background: #fff; opacity: 0; }
      html.clean .cap, html.clean #subs, html.clean .ttl { opacity: 0 !important; }
    </style>
  </head>
  <body>
    <svg id="gdefs" width="0" height="0" style="position:absolute"><g id="defsHost"></g>
      <defs>
        <radialGradient id="lamp" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#2f5a4a"/><stop offset="1" stop-color="#061010"/></radialGradient>
        <radialGradient id="glowPhone" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#c8ffe0" stop-opacity=".55"/><stop offset="1" stop-color="#c8ffe0" stop-opacity="0"/></radialGradient>
        <linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7a8"/><stop offset="1" stop-color="#f2b36b"/></linearGradient>
        <linearGradient id="sep64" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eed9b0"/><stop offset="1" stop-color="#c49a62"/></linearGradient>
        <linearGradient id="morning" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ffefc9"/></linearGradient>
      </defs>
    </svg>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30.67" data-width="1080" data-height="1920">

      <!-- S1 hook: 3 days awake, a figure behind him -->
      <div id="s1" class="clip scene" data-start="0" data-duration="2.95" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s1cam">
          <rect width="1080" height="1920" fill="url(#lamp)"/>
          <rect x="60" y="560" width="300" height="420" rx="10" fill="#0e2622" stroke="#244a40" stroke-width="12"/>
          <g id="shadow1" opacity="0"><path d="M780 1500 C760 1200 770 900 820 780 C840 720 880 700 905 720 C940 700 980 730 990 790 C1030 900 1040 1200 1020 1500Z" fill="#000" opacity=".85"/>
            <circle cx="880" cy="790" r="9" fill="#b6ff6e"/><circle cx="930" cy="790" r="9" fill="#b6ff6e"/></g>
          <circle cx="540" cy="1250" r="420" fill="url(#glowPhone)"/>
          <g id="s1p" transform="translate(480 1150) scale(1.5)"></g>
          <g transform="translate(860 1500) rotate(12)"><rect x="-80" y="-140" width="160" height="280" rx="24" fill="#111" stroke="#c8ffe0" stroke-width="6"/><rect x="-66" y="-122" width="132" height="244" rx="14" fill="#c8ffe0" opacity=".85"/>
            <text id="ph1" y="20" text-anchor="middle" font-family="Anton" font-size="62" fill="#0b2a22">3:17</text></g>
        </g></svg>
      </div>

      <!-- S2 day one: 24 hours -->
      <div id="s2" class="clip scene" data-start="2.95" data-duration="3.48" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s2cam">
          <rect id="s2sky" width="1080" height="1920" fill="url(#day)"/>
          <rect x="140" y="300" width="800" height="620" rx="20" fill="#9fdcff" stroke="#3a2a1a" stroke-width="14"/>
          <g id="skyw" clip-path="inset(0)"><rect id="skyc" x="148" y="308" width="784" height="604" fill="#9fdcff"/>
            <g id="sunmoon"><circle id="sun2" r="70" fill="#ffd23a" stroke="#3a2a1a" stroke-width="6"/><g id="moon2"><circle r="60" fill="#fff6c8"/><circle cx="24" cy="-14" r="54" fill="#1a2a4a"/></g></g></g>
          <path d="M540 300 V920 M140 610 H940" stroke="#3a2a1a" stroke-width="14"/>
          <g transform="translate(540 1230)"><circle r="230" fill="#fff" stroke="#3a2a1a" stroke-width="16"/>
            <g id="ticks2"></g><path id="hh2" d="M0 0 L0 -120" stroke="#3a2a1a" stroke-width="18" stroke-linecap="round"/><path id="mh2" d="M0 0 L0 -180" stroke="#e23a3a" stroke-width="10" stroke-linecap="round"/><circle r="16" fill="#3a2a1a"/></g>
          <g id="cnt2" transform="translate(540 1720)"><rect x="-230" y="-80" width="460" height="160" rx="24" fill="#111"/><text id="cnt2t" y="52" text-anchor="middle" font-family="Anton" font-size="140" fill="#ff4d4d">00:00</text></g>
        </g></svg>
      </div>

      <!-- S3 legally drunk -->
      <div id="s3" class="clip scene" data-start="6.43" data-duration="3.0" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s3cam">
          <rect width="1080" height="1920" fill="#203a3a"/>
          <g id="s3p" transform="translate(540 1500) scale(1.25)"></g>
          <g transform="translate(540 640)"><path d="M-330 0 A330 330 0 0 1 330 0" fill="none" stroke="#fff" stroke-width="70"/>
            <path d="M-330 0 A330 330 0 0 1 -160 -288" fill="none" stroke="#5be38a" stroke-width="56"/>
            <path d="M-160 -288 A330 330 0 0 1 160 -288" fill="none" stroke="#ffd23a" stroke-width="56"/>
            <path d="M160 -288 A330 330 0 0 1 330 0" fill="none" stroke="#ff4d4d" stroke-width="56"/>
            <text x="0" y="225" text-anchor="middle" font-family="Anton" font-size="44" fill="#fff">LEGAL LIMIT: 0.08</text>
            <g id="needle"><path d="M0 0 L0 -300" stroke="#111" stroke-width="16" stroke-linecap="round"/></g><circle r="34" fill="#111"/>
            <g id="bac" opacity="0"><rect x="-170" y="40" width="340" height="130" rx="20" fill="#ff4d4d" stroke="#111" stroke-width="8"/><text y="140" text-anchor="middle" font-family="Anton" font-size="110" fill="#fff">0.10</text></g></g>
        </g></svg>
      </div>

      <!-- S4 day two: the walls bend -->
      <div id="s4" class="clip scene" data-start="9.43" data-duration="4.15" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s4cam">
          <rect width="1080" height="1920" fill="#2a4a44"/>
          <path id="wallL" fill="#3f6b60" stroke="#122a24" stroke-width="8"/>
          <path id="wallR" fill="#356056" stroke="#122a24" stroke-width="8"/>
          <path id="floor4" fill="#1d3631" stroke="#122a24" stroke-width="8"/>
          <path id="frame4" fill="#e8d7a8" stroke="#122a24" stroke-width="10"/>
          <g id="s4p" transform="translate(540 1420) scale(1.1)"></g>
          <g transform="translate(540 520)"><g id="day2" class="ttl"><rect x="-200" y="-90" width="400" height="180" rx="28" fill="#111" stroke="#b6ff6e" stroke-width="8"/><text y="58" text-anchor="middle" font-family="Anton" font-size="150" fill="#b6ff6e">DAY 2</text></g></g>
        </g></svg>
      </div>

      <!-- S5 day three: things that aren't there -->
      <div id="s5" class="clip scene" data-start="13.58" data-duration="3.45" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s5cam">
          <rect width="1080" height="1920" fill="#040b0b"/>
          <g id="fig5" opacity="0"><path d="M120 1500 C100 1150 110 820 170 680 C190 620 240 600 270 620 C310 600 350 630 360 690 C410 820 420 1150 400 1500Z" fill="#000"/>
            <circle cx="235" cy="700" r="10" fill="#b6ff6e"/><circle cx="295" cy="700" r="10" fill="#b6ff6e"/></g>
          <g id="eyes5"></g>
          <rect x="520" y="1150" width="620" height="420" rx="60" fill="#1e3f38" stroke="#000" stroke-width="10"/>
          <g id="s5p" transform="translate(780 1230) scale(1.05)"></g>
          <rect x="480" y="1560" width="660" height="200" rx="40" fill="#2a5a50" stroke="#000" stroke-width="10"/>
          <rect x="470" y="1380" width="110" height="380" rx="50" fill="#2f6358" stroke="#000" stroke-width="10"/>
          <g id="day3" class="ttl" transform="translate(540 520)" opacity="0"><text y="58" text-anchor="middle" font-family="Anton" font-size="170" fill="#ff4d4d" stroke="#000" stroke-width="16" paint-order="stroke">DAY 3</text></g>
        </g></svg>
      </div>

      <!-- S6 1964: eleven days awake -->
      <div id="s6" class="clip scene" data-start="17.03" data-duration="4.4" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s6cam">
          <rect width="1080" height="1920" fill="url(#sep64)"/>
          <g id="pen6"><rect x="560" y="900" width="380" height="120" rx="14" fill="#a33a2a" stroke="#3a2a1a" stroke-width="8"/><text x="750" y="988" text-anchor="middle" font-family="Anton" font-size="78" fill="#f6e6c0">SCIENCE FAIR</text></g>
          <g id="cal6" transform="translate(300 700)"><rect x="-170" y="-200" width="340" height="400" rx="16" fill="#fffdf3" stroke="#3a2a1a" stroke-width="10"/>
            <rect x="-170" y="-200" width="340" height="100" rx="16" fill="#c0392b"/><text y="-125" text-anchor="middle" font-family="Anton" font-size="56" fill="#fff">DAY · 1963–64</text>
            <text id="calN" y="130" text-anchor="middle" font-family="Anton" font-size="230" fill="#3a2a1a">1</text>
            <g id="calPage"><rect x="-170" y="-100" width="340" height="300" fill="#fffdf3" stroke="#3a2a1a" stroke-width="6"/></g></g>
          <g id="s6p" transform="translate(720 1330) scale(1.05)"></g>
          <path d="M-20 1640 H1100 V1920 H-20Z" fill="#7a5a3a" stroke="#3a2a1a" stroke-width="8"/>
          <rect width="1080" height="1920" fill="#7a4a1a" opacity=".12"/>
        </g></svg>
      </div>

      <!-- S7 he could barely remember anything -->
      <div id="s7" class="clip scene" data-start="21.43" data-duration="2.87" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s7cam">
          <rect width="1080" height="1920" fill="url(#sep64)"/>
          <g id="s7p" transform="translate(540 1300) scale(1.45)"></g>
          <g id="icons7"></g>
          <rect width="1080" height="1920" fill="#7a4a1a" opacity=".12"/>
        </g></svg>
      </div>

      <!-- S8 slept almost fifteen hours -->
      <div id="s8" class="clip scene" data-start="24.3" data-duration="3.47" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s8cam">
          <rect id="s8bg" width="1080" height="1920" fill="#2a3a6a"/>
          <rect x="80" y="1040" width="920" height="260" rx="120" fill="#f3f0ff" stroke="#1d120b" stroke-width="8"/>
          <path d="M-20 1220 L1100 1220 L1100 1920 L-20 1920Z" fill="#5a78c8" stroke="#1d120b" stroke-width="8"/>
          <g id="s8p" transform="translate(440 1120) rotate(-80)"></g>
          <path d="M-20 1260 C300 1220 700 1240 1100 1220 L1100 1920 L-20 1920Z" fill="#6f8ce0" stroke="#1d120b" stroke-width="8"/>
          <g transform="translate(540 680)"><circle r="170" fill="#fff" stroke="#1d120b" stroke-width="14"/><path id="hh8" d="M0 0 L0 -100" stroke="#1d120b" stroke-width="16" stroke-linecap="round"/><path id="mh8" d="M0 0 L0 -150" stroke="#e23a3a" stroke-width="9" stroke-linecap="round"/><circle r="14" fill="#1d120b"/></g>
          <g id="zz8" font-family="Anton" fill="#fff" stroke="#1d120b" stroke-width="8" paint-order="stroke"><text id="zA" font-size="90">Z</text><text id="zB" font-size="120">Z</text><text id="zC" font-size="70">Z</text></g>
        </g></svg>
      </div>

      <!-- S9 woke up fine -->
      <div id="s9" class="clip scene" data-start="27.77" data-duration="2.9" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s9cam">
          <rect width="1080" height="1920" fill="url(#morning)"/>
          <g id="rays9"></g>
          <circle cx="840" cy="420" r="110" fill="#ffd23a" stroke="#d48a1a" stroke-width="8"/>
          <g id="s9p" transform="translate(540 1250) scale(1.4)"></g>
          
        </g></svg>
      </div>

      <div id="c1" class="clip cap" data-start="0" data-duration="2.95" data-track-index="1" style="top:300px"><span id="c1a" class="ln">3 DAYS AWAKE</span><span id="c1b" class="ln hi sm">= HALLUCINATIONS</span></div>
      <div id="c3" class="clip cap" data-start="8.75" data-duration="0.68" data-track-index="1" style="top:905px"><span id="c3a" class="ln red">= DRUNK</span></div>
      <div id="c6" class="clip cap" data-start="19.5" data-duration="1.93" data-track-index="1" style="top:300px"><span id="c6a" class="ln sun">11 DAYS</span></div>
      <div id="c8" class="clip cap" data-start="26.2" data-duration="1.57" data-track-index="1" style="top:300px"><span id="c8a" class="ln sun">15 HOURS</span></div>
      <div id="c9" class="clip cap" data-start="28.9" data-duration="1.77" data-track-index="1" style="top:300px"><span id="c9a" class="ln hi">FINE.</span></div>

      <audio id="mix" class="clip" data-start="0" data-duration="30.67" data-track-index="2" data-volume="1" src="assets/mix.wav"></audio>
      <div id="subs"></div>
      <div id="vig"></div>
      <div id="grain"></div>
      <div id="flash"></div>
    </div>

    <script>
      const X = window.XR, T = X.tf, R = X.rand(19);
      document.getElementById("defsHost").outerHTML = X.defs();
      { const st = document.createElement("style"); st.textContent = X.CAP_CSS; document.head.appendChild(st); }
      const w = (s, i) => window.TIMING[s][i];
      X.captions({ capY: (t) => (t < 2.95 ? 600 : t < 6.43 ? 1520 : t < 9.43 ? 1120 : t < 13.58 ? 1080 : t < 17.03 ? 1600 : t < 21.43 ? 1680 : t < 24.3 ? 300 : t < 27.77 ? 1500 : 1640) });

      const tired = { skin: "#e0b48e", skinD: "#c08a66", hair: "#2a1d12", hairStyle: "short", shirt: "#5a6670", iris: "#3a5a3a", bags: true };
      X.put("s1p", X.person("m1", 1, { ...tired, veins: true }));
      X.put("s3p", X.person("m3", 1, { ...tired, veins: true }));
      X.put("s4p", X.person("m4", 1, { ...tired, veins: true }));
      X.put("s5p", X.person("m5", 1, { ...tired, veins: true }));
      const teen = { skin: "#f0c8a0", skinD: "#d09a72", hair: "#a8742a", hairStyle: "short", shirt: "#3a6ab0", iris: "#3a5a8a" };
      X.put("s6p", X.person("t6", 1, teen));
      X.put("s7p", X.person("t7", 1, { ...teen, bags: true }));
      X.put("s8p", X.person("t8", 1, teen));
      X.put("s9p", X.person("t9", 1, teen));
      // clock ticks
      let tk = ""; for (let i = 0; i < 12; i++) tk += `<path d="M0 -200 L0 -${i % 3 ? 180 : 165}" stroke="#3a2a1a" stroke-width="${i % 3 ? 6 : 12}" transform="rotate(${i * 30})"/>`;
      X.put("ticks2", tk);
      // S5 eyes in the dark
      const ep = [[900, 640], [150, 1650], [960, 900], [620, 760], [180, 560]];
      X.put("eyes5", ep.map((p, i) => `<g id="ey${i}" transform="translate(${p[0]} ${p[1]})" opacity="0"><ellipse cx="-22" rx="14" ry="9" fill="#b6ff6e"/><ellipse cx="22" rx="14" ry="9" fill="#b6ff6e"/></g>`).join(""));
      // S7 memory icons leaving his head
      const icons = ["KEYS", "NAME?", "2+2", "WHERE?"];
      X.put("icons7", icons.map((s, i) => `<g id="ic${i}" opacity="0"><rect x="-110" y="-50" width="220" height="100" rx="22" fill="#fffdf3" stroke="#3a2a1a" stroke-width="7"/><text y="26" text-anchor="middle" font-family="Anton" font-size="62" fill="#3a2a1a">${s}</text></g>`).join(""));
      let rays = ""; for (let i = 0; i < 16; i++) rays += `<path d="M840 420 L${840 + Math.cos(i / 16 * 6.283) * 1800} ${420 + Math.sin(i / 16 * 6.283) * 1800} L${840 + Math.cos((i + 0.45) / 16 * 6.283) * 1800} ${420 + Math.sin((i + 0.45) / 16 * 6.283) * 1800}Z" fill="#fff6d8" opacity=".5"/>`;
      X.put("rays9", rays);

      const W = (t, a, b) => t >= a - 0.05 && t < b + 0.05;
      const lerp = (a, b, k) => a + (b - a) * k;
      X.life((t) => {
        if (W(t, 0, 2.95)) {
          X.personLife("m1", t, { lid: 0.05, pupil: 0.55, gaze: [14, -6], brow: 0.7, open: 0.15 + X.sm(1.9, 2.2, t) * 0.4, smile: -0.5, tilt: Math.sin(t * 7) * 1.5, phase: 0.2 });
          X.attr("shadow1", "opacity", (X.sm(0.0, 0.5, t) * (0.85 + 0.15 * Math.sin(t * 17))).toFixed(2));
          T("shadow1", `translate(${Math.sin(t * 1.3) * 12} 0)`);
        }
        if (W(t, 2.95, 6.43)) {
          const k = X.clamp((t - 3.0) / 3.3, 0, 1), hrs = Math.floor(k * 24);
          X.attr("cnt2t", "textContent", ""); document.getElementById("cnt2t").textContent = `${String(hrs).padStart(2, "0")}:${String(Math.floor((k * 24 * 60) % 60)).padStart(2, "0")}`;
          T("hh2", `rotate(${(k * 24 % 12) * 30 + (k * 24 * 60 % 60) * 0.5})`); T("mh2", `rotate(${(k * 24 * 60 % 60) * 6})`);
          // the clock starts at midnight: night until 07:00, day 07:00-19:00, night again (one body at a time)
          const h = k * 24, day = h >= 7 && h < 19;
          const dk = day ? (h - 7) / 12 : ((h + 5) % 24) / 12;   // 0..1 across the window
          const x = 200 + dk * 680, y = 760 - Math.sin(dk * Math.PI) * 360;
          T("sun2", `translate(${x} ${y})`); T("moon2", `translate(${x} ${y})`);
          X.attr("sun2", "opacity", day ? 1 : 0); X.attr("moon2", "opacity", day ? 0 : 1);
          X.attr("skyc", "fill", day ? "#9fdcff" : "#1a2a4a");
          X.attr("s2sky", "fill", day ? "url(#day)" : "#4a4a7a");
        }
        if (W(t, 6.43, 9.43)) {
          const k = X.sm(6.6, 8.8, t), wob = Math.sin(t * 9) * 4 * (1 - X.sm(8.8, 9.2, t));
          T("needle", `rotate(${-80 + k * 148 + wob})`);
          X.attr("bac", "opacity", t > 8.75 ? 1 : 0);
          X.personLife("m3", t, { lid: 0.45, gaze: [Math.sin(t * 3) * 14, 4], open: 0.2, smile: 0.2, tilt: Math.sin(t * 2.2) * 9, phase: 1 });
        }
        if (W(t, 9.43, 13.58)) {
          const b = X.sm(10.9, 12.3, t), wv = (y, f) => Math.sin(y / 180 + t * 3.2 + f) * 70 * b;
          let L = "M0 0", Rr = "M1080 0";
          for (let y = 0; y <= 1500; y += 60) { L += ` L${(260 + wv(y, 0)).toFixed(1)} ${y}`; Rr += ` L${(820 + wv(y, 2)).toFixed(1)} ${y}`; }
          X.attr("wallL", "d", L + " L0 1500Z"); X.attr("wallR", "d", Rr + " L1080 1500Z");
          X.attr("floor4", "d", `M0 1500 L${260 + wv(1500, 0)} 1500 L${820 + wv(1500, 2)} 1500 L1080 1500 L1080 1920 L0 1920Z`);
          const fx = 540, fy = 860, s = b * 60;
          X.attr("frame4", "d", `M${fx - 120 + Math.sin(t * 3) * s * 0.3} ${fy - 90} L${fx + 120} ${fy - 90 + s * 0.4} L${fx + 120 + s * 0.5} ${fy + 90 + s} L${fx - 120} ${fy + 90 + s * 0.6}Z`);
          X.personLife("m4", t, { lid: 0.25, gaze: [Math.sin(t * 1.7) * 16, -8], brow: 0.5 * b, open: 0.12, smile: -0.2, pupil: 0.8, tilt: Math.sin(t * 2.6) * 4 * b, phase: 2 });
        }
        if (W(t, 13.58, 17.03)) {
          X.personLife("m5", t, { lid: 0, pupil: 0.45, gaze: [-18, -14], brow: 0.9, open: 0.25 + X.sm(15.1, 15.4, t) * 0.4, smile: -0.6, phase: 3 });
          X.attr("fig5", "opacity", t > 15.15 ? (0.75 + 0.25 * Math.sin(t * 23)).toFixed(2) : 0);
          ep.forEach((p, i) => { const on = t > 15.8 + i * 0.12; const bl = ((t * 1.7 + i) % 1.3) < 0.1; X.attr(`ey${i}`, "opacity", on && !bl ? 1 : 0); });
          X.attr("day3", "opacity", t > 13.6 ? 1 : 0);
        }
        if (W(t, 17.03, 21.43)) {
          const k = X.clamp((t - 19.0) / 1.3, 0, 1), d = Math.max(1, Math.min(11, 1 + Math.floor(k * 10.999)));
          document.getElementById("calN").textContent = d;
          const flip = k > 0 && k < 1 ? ((t - 19.0) / (1.3 / 10)) % 1 : 1;
          X.attr("calPage", "transform", `scale(1 ${(1 - flip).toFixed(3)})`);
          X.attr("calPage", "opacity", k > 0 && k < 1 ? 1 : 0);
          X.personLife("t6", t, { gaze: [-16, -6], smile: 0.6, open: t > 19.5 ? 0.25 : 0, brow: t > 19.5 ? 0.5 : 0, lid: X.sm(17.5, 20.3, t) * 0.4, phase: 0.6 });
        }
        if (W(t, 21.43, 24.3)) {
