    <style>

      #grain { position: absolute; inset: 0; z-index: 30; opacity: .08; mix-blend-mode: overlay; background: url(assets/grain.png); }

      #flash { position: absolute; inset: 0; z-index: 31; background: #fff; opacity: 0; }
      html.clean .cap, html.clean #subs { opacity: 0 !important; }
    </style>
  </head>
  <body>
    <svg id="gdefs" width="0" height="0" style="position:absolute"><g id="defsHost"></g>

    <div id="root" data-composition-id="main" data-start="0.0" data-duration="41.23" data-width="1080" data-height="1920">

            <ellipse cx="540" cy="620" rx="420" ry="300" fill="url(#bubbleG)" stroke="#1a0f33" stroke-width="8"/></g>

          <g transform="translate(540 830)"><g id="stamp1" opacity="0"><rect x="-300" y="-62" width="600" height="124" rx="14" fill="#fffdf6" fill-opacity=".55" stroke="#ff2a3d" stroke-width="12"/>
            <text y="34" text-anchor="middle" font-family="Anton" font-size="86" fill="#ff2a3d">NEVER HAPPENED</text></g></g>
        </g></svg>

      <!-- S2 the brain doesn't replay -->

            <path d="M-40 -70 L80 0 L-40 70Z" fill="#1a0f33"/><g id="xmark" opacity="0"><path d="M-170 -170 L170 170 M170 -170 L-170 170" stroke="#ff2a3d" stroke-width="40" stroke-linecap="round"/></g></g>
        </g></svg>
      </div>

      <!-- S3 it rebuilds them -->
      <div id="s3" class="clip scene" data-start="5.542" data-duration="4.058" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s3cam">
          <rect width="1080" height="1920" fill="#2a1d5c"/>

      <!-- S4 1995 lab -->
      <div id="s4" class="clip scene" data-start="9.6" data-duration="6.345" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s4cam">
          <rect width="1080" height="1920" fill="url(#labWall)"/>
          <rect x="680" y="300" width="300" height="380" rx="10" fill="#f6f3ea" stroke="#1a0f33" stroke-width="8"/>
          <path d="M710 360 H950 M710 420 H920 M710 480 H950 M710 540 H900" stroke="#b9b2a0" stroke-width="12" stroke-linecap="round"/>
          <g id="cal95" transform="translate(250 470)"><rect x="-110" y="-120" width="220" height="240" rx="12" fill="#fff" stroke="#1a0f33" stroke-width="8"/>
            <rect x="-110" y="-120" width="220" height="70" rx="12" fill="#d1242f"/><text y="80" text-anchor="middle" font-family="Anton" font-size="120" fill="#1a0f33">1995</text></g>
          <g id="s4psy" transform="translate(300 1060) scale(.95)"></g>
          <g id="s4sub" transform="translate(800 1080) scale(.9)"></g>
          <path d="M-20 1440 H1100 V1920 H-20Z" fill="#7b5a3c" stroke="#1a0f33" stroke-width="8"/>
          <path d="M-20 1440 H1100" stroke="#a37a52" stroke-width="16"/>
          <g id="cards4"></g>

      <!-- S5 three real, one invented -->

          <g id="s5wood" stroke="#6a4b30" stroke-width="10"></g>
          <g id="cards5"></g>
        </g></svg>
      </div>

      <!-- S6 lost in a mall, age five (the invented memory) -->
      <div id="s6" class="clip scene" data-start="20.289" data-duration="5.743" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s6cam">
          <rect width="1080" height="1920" fill="url(#sepia)"/>
          <g id="shops"></g>
          <path d="M-40 1250 L1120 1250 L1120 1960 L-40 1960Z" fill="#c9a777"/>
          <g id="tiles6" stroke="#b08d5e" stroke-width="5"></g>
          <g id="legs"></g>
          <g id="kid" transform="translate(540 1230) scale(.6)"></g>
          <rect width="1080" height="1920" fill="#7a4a1a" opacity=".16"/>
        </g></svg>
      </div>

      <!-- S7 one in four remembered it -->
      <div id="s7" class="clip scene" data-start="26.032" data-duration="3.459" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s7cam">
          <rect width="1080" height="1920" fill="#241650"/>

            <rect id="bar8" x="-392" y="-32" width="0" height="64" rx="32" fill="#ff4d5a"/></g>
        </g></svg>
      </div>

      <!-- S9 how sure are you -->
      <div id="s9" class="clip scene" data-start="33.848" data-duration="7.382" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s9cam">
          <rect width="1080" height="1920" fill="url(#dream)"/>
          <g id="s9stars"></g>
          <g id="s9p" transform="translate(540 1420)"></g>
          <g><circle cx="470" cy="1000" r="26" fill="url(#bubbleG)" stroke="#1a0f33" stroke-width="6"/><circle cx="430" cy="930" r="40" fill="url(#bubbleG)" stroke="#1a0f33" stroke-width="6"/>
            <ellipse cx="540" cy="620" rx="420" ry="300" fill="url(#bubbleG)" stroke="#1a0f33" stroke-width="8"/></g>
          <g id="pol9" transform="translate(540 610) rotate(-4)"></g>

      <!-- big key words (Anton), separate from the calm subtitles -->
      <div id="c3" class="clip cap" data-start="6.158" data-duration="3.442" data-track-index="1" style="top:300px"><span id="c3a" class="ln hi">REBUILT</span><span id="c3b" class="ln sm">EVERY TIME</span></div>
      <div id="c5" class="clip cap" data-start="19.47" data-duration="0.819" data-track-index="1" style="top:300px"><span id="c5a" class="ln red">INVENTED</span></div>
      <div id="c6" class="clip cap" data-start="23.788" data-duration="2.244" data-track-index="1" style="top:300px"><span id="c6a" class="ln">AGE 5</span></div>
      <div id="c7" class="clip cap" data-start="26.875" data-duration="2.616" data-track-index="1" style="top:300px"><span id="c7a" class="ln hi">1 IN 4</span><span id="c7b" class="ln sm">"REMEMBERED" IT</span></div>
      <div id="c8" class="clip cap" data-start="32.781" data-duration="1.067" data-track-index="1" style="top:300px"><span id="c8a" class="ln red">UP TO 50%</span></div>
      <div id="c9" class="clip cap" data-start="38.328" data-duration="2.902" data-track-index="1" style="top:300px"><span id="c9a" class="ln hi">HOW SURE?</span></div>

      <audio id="mix" class="clip" data-start="0.0" data-duration="41.23" data-track-index="2" data-volume="1" src="assets/mix.wav"></audio>

      <div id="vig"></div>
      <div id="grain"></div>
      <div id="flash"></div>

    <script>
      const X = window.XR, T = X.tf, R = X.rand(18);
      document.getElementById("defsHost").outerHTML = X.defs();
      { const st = document.createElement("style"); st.textContent = X.CAP_CSS; document.head.appendChild(st); }
      const OLDW = {"1": [0.03, 0.15, 0.57, 1.03, 1.29, 1.67], "2": [3.04, 3.71, 4.11, 4.66, 5.07], "3": [6.18, 6.97, 7.45, 7.9, 8.83, 9.32], "4": [10.07, 10.84, 13.0, 14.03, 14.34, 14.76, 15.15, 15.86], "5": [16.64, 17.69, 17.96, 19.53, 19.68, 20.1], "6": [20.88, 21.87, 22.25, 22.39, 22.48, 22.9, 23.37, 23.53, 23.81], "7": [24.57, 25.85, 26.17, 26.45, 26.94, 27.51, 27.68], "8": [29.22, 30.02, 30.49, 30.84, 31.08, 31.2, 31.34, 31.48], "9": [32.3, 33.22, 33.56, 34.06, 34.33, 34.7], "10": [36.49, 36.58, 36.9, 37.14]};
      const w = (s, i) => OLDW[s][i];   // the animation is authored on the first take's clock; see the time warp at the end
      const ANC = [[0.0, 0.0], [0.03, 0.025], [0.15, 0.238], [0.57, 0.722], [1.03, 1.113], [1.29, 1.345], [1.67, 1.598], [3.04, 2.875], [3.71, 3.422], [4.11, 3.795], [4.66, 4.144], [5.07, 4.617], [6.18, 5.568], [6.97, 6.215], [7.45, 6.779], [7.9, 7.968], [8.83, 8.304], [9.32, 8.795], [10.07, 9.622], [10.84, 10.555], [13.0, 12.464], [14.03, 13.419], [14.34, 13.744], [14.76, 14.235], [15.15, 14.611], [15.86, 15.185], [16.64, 15.955], [17.69, 17.259], [17.96, 17.379], [19.53, 18.99], [19.68, 19.155], [20.1, 19.568], [20.88, 20.275], [21.87, 21.647], [22.25, 22.148], [22.39, 22.295], [22.48, 22.388], [22.9, 22.879], [23.37, 23.482], [23.53, 24.095], [23.81, 24.447], [24.57, 26.075], [25.85, 26.908], [26.17, 27.315], [26.45, 27.608], [26.94, 27.979], [27.51, 28.541], [27.68, 28.717], [29.22, 29.501], [30.02, 31.038], [30.49, 31.608], [30.84, 32.061], [31.08, 32.248], [31.2, 32.488], [31.34, 32.701], [31.48, 32.888], [32.3, 33.848], [33.22, 34.888], [33.56, 35.265], [34.06, 35.648], [34.33, 35.915], [34.7, 36.381], [36.49, 38.372], [36.58, 38.472], [36.9, 38.788], [38.62, 41.23]];
      const n2o = (x) => { for (let k = 0; k < ANC.length - 1; k++) { const [a, b] = ANC[k], [c, d] = ANC[k + 1]; if (x >= b && x <= d) return d === b ? a : a + (x - b) / (d - b) * (c - a); } return x; };
      // subtitles: lower in the scenes where a face sits at caption height
      X.captions({ capY: (t) => ((t) => (t < 3.03 || t >= 32.3 ? 1035 : t < 6.15 ? 1100 : t >= 10.05 && t < 16.63 ? 1580 : t >= 20.89 && t < 24.55 ? 1040 : 1500))(n2o(t)) });

      // ---------- polaroid memory (a party at age 7) ----------
      const polaroid = (id, o = {}) => {
        const bal = o.bal || ["#ff4d5a", "#4dd2ff", "#ffd400"];
        return `<g id="${id}"><rect x="-230" y="-200" width="460" height="420" rx="10" fill="#fffdf6" stroke="#1a0f33" stroke-width="8"/>
          <rect x="-200" y="-170" width="400" height="310" fill="#9fd8ff"/>
          <rect x="-200" y="60" width="400" height="80" fill="#f4c27a"/>
          ${bal.map((c, i) => `<g id="${id}-b${i}"><path d="M${-120 + i * 110} ${-40 + (i % 2) * 20} q-10 60 8 110" stroke="#1a0f33" stroke-width="3" fill="none"/><ellipse cx="${-120 + i * 110}" cy="${-80 + (i % 2) * 20}" rx="38" ry="46" fill="${c}" stroke="#1a0f33" stroke-width="5"/></g>`).join("")}
          <g transform="translate(110 70)"><rect x="-70" y="-30" width="140" height="70" rx="8" fill="#ff9ec4" stroke="#1a0f33" stroke-width="5"/><rect x="-70" y="-30" width="140" height="20" fill="#fff"/>
            ${[-40, 0, 40].map((x) => `<rect x="${x - 5}" y="-62" width="10" height="32" fill="#7ad"/><ellipse cx="${x}" cy="-70" rx="7" ry="11" fill="#ffd400"/>`).join("")}</g>
          <g id="${id}-kid" transform="translate(-90 80) scale(.32)">${X.person(id + "k", 1, { skin: "#f2c6a0", hair: "#7a3b1a", hairStyle: "curly", shirt: "#7a4cff" })}</g>
          <text x="0" y="196" text-anchor="middle" font-family="Anton" font-size="34" fill="#4a3a6a">AGE 7</text></g>`;
      };
      const her = { skin: "#f2c6a8", skinD: "#d79c7c", hair: "#b8462c", hairStyle: "long", shirt: "#3aa7a0", iris: "#3c6e9a" };
      X.put("s1p", X.person("h1", 1.4, her));
      X.put("pol1", polaroid("p1"));
      X.put("s9p", X.person("h9", 1.4, her));
      X.put("pol9", polaroid("p9"));
      let stars = ""; for (let i = 0; i < 40; i++) stars += `<circle cx="${(R() * 1080).toFixed(0)}" cy="${(R() * 1920).toFixed(0)}" r="${(2 + R() * 4).toFixed(1)}" fill="#fff" opacity="${(0.2 + R() * 0.6).toFixed(2)}"/>`;
      X.put("s1stars", stars); X.put("s9stars", stars);
      // the missing puzzle piece in S1 (white hole that gets painted in)
      X.put("pol1", `<g id="hole1"><path d="M40 -150 h120 v50 a22 22 0 1 1 0 44 v66 h-120 v-60 a22 22 0 1 0 0 -44Z" fill="#fffdf6" stroke="#1a0f33" stroke-width="5" stroke-dasharray="14 10"/></g>`);

      // S2: cinema + brain
      let seats = ""; for (let r = 0; r < 3; r++) for (let i = 0; i < 9; i++) seats += `<rect x="${30 + i * 118}" y="${1580 + r * 110}" width="100" height="90" rx="26" fill="#3a2a7a" stroke="#120c2a" stroke-width="6"/>`;
      X.put("seats", seats);
      X.put("pol2", polaroid("p2"));
      const brain = (id) => `<g id="${id}"><path d="M-190 40 C-260 -40 -200 -170 -100 -170 C-70 -230 30 -240 70 -180 C160 -220 250 -130 210 -40 C270 20 230 130 140 130 C100 190 -20 190 -60 140 C-160 170 -240 110 -190 40Z" fill="url(#brainG)" stroke="#1a0f33" stroke-width="9"/>
        <path d="M-120 -60 q40 30 0 70 M-20 -150 q-30 60 20 100 q40 30 10 90 M90 -120 q40 40 -10 80 M150 -10 q-40 40 0 90" fill="none" stroke="#c95a82" stroke-width="8" stroke-linecap="round"/>
        <g transform="translate(-50 -20)"><circle cx="-40" r="26" fill="#fff" stroke="#1a0f33" stroke-width="5"/><circle cx="40" r="26" fill="#fff" stroke="#1a0f33" stroke-width="5"/>
          <circle id="${id}-p0" cx="-40" r="12" fill="#1a0f33"/><circle id="${id}-p1" cx="40" r="12" fill="#1a0f33"/>
          <path id="${id}-m" d="M-30 50 Q0 70 30 50" fill="none" stroke="#1a0f33" stroke-width="7" stroke-linecap="round"/></g></g>`;
      X.put("brain2", brain("br2"));

      // S3 builders (tiny neuron workers) and the rebuilt polaroid versions
      let grid = ""; for (let i = 0; i < 12; i++) grid += `<path d="M${i * 100} 0 V1920"/>`; for (let j = 0; j < 20; j++) grid += `<path d="M0 ${j * 100} H1080"/>`;
      X.put("s3grid", grid);
      const vers = [["#ff4d5a", "#4dd2ff", "#ffd400"], ["#7bff5a", "#ff4d5a", "#a259ff"], ["#ffd400", "#ff7a2b", "#4dd2ff"]];
      X.put("pol3a", vers.map((v, i) => `<g id="v${i}" opacity="${i ? 0 : 1}">${polaroid("p3" + i, { bal: v })}</g>`).join(""));
      const worker = (id, x, y, c) => `<g id="${id}" transform="translate(${x} ${y})"><circle r="46" fill="url(#brainG)" stroke="#1a0f33" stroke-width="6"/>
        <path d="M-50 -18 Q0 -80 50 -18Z" fill="${c}" stroke="#1a0f33" stroke-width="6"/><circle cx="-14" cy="6" r="7" fill="#1a0f33"/><circle cx="14" cy="6" r="7" fill="#1a0f33"/>
        <path d="M-12 24 Q0 32 12 24" stroke="#1a0f33" stroke-width="5" fill="none"/>
        <g id="${id}-arm"><path d="M40 10 L90 -20" stroke="#1a0f33" stroke-width="10" stroke-linecap="round"/><rect x="80" y="-50" width="44" height="26" rx="6" fill="#999" stroke="#1a0f33" stroke-width="5" transform="rotate(-30 100 -36)"/></g></g>`;
      X.put("builders", worker("wk0", 200, 1200, "#ffd400") + worker("wk1", 880, 1190, "#ff7a2b") + worker("wk2", 540, 1215, "#4dd2ff"));
      let blk = ""; for (let i = 0; i < 9; i++) blk += `<rect id="bk${i}" x="-30" y="-30" width="60" height="60" rx="8" fill="${["#ff4d5a", "#4dd2ff", "#ffd400", "#7bff5a"][i % 4]}" stroke="#1a0f33" stroke-width="5" opacity="0"/>`;
      X.put("blocks", blk);

      // S4 psychologist + participant + 4 cards
      X.put("s4psy", X.person("psy", 1, { skin: "#e8b48c", skinD: "#c48b62", hair: "#5a3a22", hairStyle: "short", shirt: "#f4f4f4", glasses: true, beard: true, iris: "#3a2a1a" }));
      X.put("s4sub", X.person("sub", 1, { skin: "#8a5a3c", skinD: "#6b4028", hair: "#1a0f08", hairStyle: "curly", shirt: "#e8573a", iris: "#2a1a10" }));
      const card = (id, kind) => `<g id="${id}"><rect x="-90" y="-120" width="180" height="240" rx="14" fill="#fffdf6" stroke="#1a0f33" stroke-width="7"/>
        <rect x="-70" y="-100" width="140" height="110" rx="6" fill="${kind}"/><path d="M-60 40 H60 M-60 70 H40 M-60 100 H50" stroke="#c2b8a3" stroke-width="10" stroke-linecap="round"/></g>`;
