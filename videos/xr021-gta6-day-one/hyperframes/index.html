    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1a0f0a; }
      #root { position: relative; width: 100%; height: 100%; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .cap { position: absolute; left: 0; width: 1080px; text-align: center; z-index: 20; }
      .ln { display: block; font-family: "Anton"; font-size: 140px; line-height: 1.02; color: #fff; -webkit-text-stroke: 14px #1a0f0a;
            paint-order: stroke fill; text-shadow: 0 10px 0 rgba(0,0,0,.35); letter-spacing: 1px; }
      .ln.gold { color: #ffd23f; } .ln.coral { color: #ff6b4a; } .ln.mint { color: #7dffb0; } .ln.sm { font-size: 92px; } .ln.xs { font-size: 70px; -webkit-text-stroke: 10px #1a0f0a; }
      .ln.box { display: inline-block; background: #ff3b30; color: #fff; padding: 6px 34px 10px; border-radius: 18px; border: 10px solid #1a0f0a; -webkit-text-stroke: 0; text-shadow: none; }
      #grain { position: absolute; inset: 0; z-index: 30; opacity: .08; mix-blend-mode: overlay; background: url(assets/grain.png); }
      #vig { position: absolute; inset: 0; z-index: 29; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(20,6,0,.5) 100%); }
      #flash { position: absolute; inset: 0; z-index: 31; background: #fff6d6; opacity: 0; }
      html.clean .cap, html.clean #subs, html.clean .ttl { opacity: 0 !important; }
    </style>
  </head>
  <body>

        <radialGradient id="tvglow" cx="50%" cy="60%" r="60%"><stop offset="0" stop-color="#7ff6ff" stop-opacity=".55"/><stop offset="1" stop-color="#7ff6ff" stop-opacity="0"/></radialGradient>

        <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6e0f1e"/><stop offset=".5" stop-color="#b8243a"/><stop offset="1" stop-color="#6e0f1e"/></linearGradient>
        <radialGradient id="spot" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#ffe9b8" stop-opacity=".55"/><stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/></radialGradient>
        <radialGradient id="plum" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#3d1f4f"/><stop offset="1" stop-color="#140a1d"/></radialGradient>
        <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1630"/><stop offset="1" stop-color="#5a2e2a"/></linearGradient>
        <linearGradient id="billG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9f0b0"/><stop offset="1" stop-color="#6cc46a"/></linearGradient>
      </defs>
    </svg>
    <div id="root" data-composition-id="main" data-start="0" data-duration="21.08" data-width="1080" data-height="1920">

      <!-- S1 hook: a gamepad erupting money under the number -->

            <path id="hh2" d="M0 0 L0 -52" stroke="#120804" stroke-width="12" stroke-linecap="round"/><path id="mh2" d="M0 0 L0 -76" stroke="#ff5a3c" stroke-width="7" stroke-linecap="round"/><circle r="10" fill="#120804"/></g>
          <ellipse id="glow2" cx="540" cy="1080" rx="560" ry="700" fill="url(#tvglow)"/>

                    <path d="M-40 1770 H1120 V1960 H-40Z" fill="#5a3322" stroke="#120804" stroke-width="10"/><path d="M-40 1790 H1120" stroke="#7a4a32" stroke-width="8"/>
          <g transform="translate(540 1630)"><g id="pad2w"><g id="pad2"></g>

      <!-- S3 the chart: GTA V day one vs GTA VI day one -->

          <rect id="barL" x="190" y="1480" width="250" height="0" fill="url(#barOld)" stroke="#2a1408" stroke-width="10"/>
          <rect id="barR" x="560" y="1480" width="300" height="0" fill="url(#barHot)" stroke="#2a1408" stroke-width="10"/>
          <g id="seg3" stroke="#fff" stroke-width="6" stroke-dasharray="18 14" opacity=".85"></g>
          <text id="valL" x="315" y="1270" text-anchor="middle" font-family="Anton" font-size="84" fill="#2f9a62" stroke="#2a1408" stroke-width="8" paint-order="stroke">$800M</text>
          <text id="valR" x="710" y="1420" text-anchor="middle" font-family="Anton" font-size="104" fill="#ff4f5e" stroke="#2a1408" stroke-width="9" paint-order="stroke">$0.80B</text>
          <text x="315" y="1560" text-anchor="middle" font-family="Anton" font-size="62" fill="#2a1408">GTA V · 2013</text>
          <text x="710" y="1560" text-anchor="middle" font-family="Anton" font-size="62" fill="#2a1408">GTA VI · 2026</text>
          <text x="315" y="900" text-anchor="middle" font-family="Anton" font-size="56" fill="#8a5a3a">FIRST-DAY</text><text x="315" y="962" text-anchor="middle" font-family="Anton" font-size="56" fill="#8a5a3a">SALES</text></g>
        </g></svg>

      <!-- S4 the scale: a whole movie run vs one game day -->
      <div id="s4" class="clip scene" data-start="9.52" data-duration="3.88" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s4cam">
          <rect width="1080" height="1920" fill="#2b0d14"/>
                    <ellipse cx="540" cy="900" rx="620" ry="900" fill="url(#spot)"/>
          <path id="curL" fill="url(#curtain)" stroke="#3a0610" stroke-width="8"/>
          <path id="curR" fill="url(#curtain)" stroke="#3a0610" stroke-width="8"/>
          <rect x="0" y="1310" width="1080" height="620" fill="#3d1018"/>
          <g transform="translate(-20 -240)">
          <!-- stand -->
          <path d="M420 1520 L660 1520 L620 1470 L460 1470Z" fill="#d9a441" stroke="#2a1408" stroke-width="10" stroke-linejoin="round"/>
          <rect x="522" y="840" width="36" height="640" fill="#e8b84f" stroke="#2a1408" stroke-width="10"/>
          <g id="armL"><path id="strL" stroke="#2a1408" stroke-width="7" fill="none"/>
            <g id="panL"><g transform="scale(.85)"><path d="M-170 0 Q0 90 170 0Z" fill="#e8b84f" stroke="#2a1408" stroke-width="10" stroke-linejoin="round"/><g id="tix"></g></g></g></g>
          <g id="armR"><path id="strR" stroke="#2a1408" stroke-width="7" fill="none"/>
            <g id="panR"><g transform="scale(.85)"><path d="M-170 0 Q0 90 170 0Z" fill="#e8b84f" stroke="#2a1408" stroke-width="10" stroke-linejoin="round"/>
              <g transform="translate(0 -6)"><rect x="-80" y="-230" width="160" height="226" rx="12" fill="#1c1a24" stroke="#2a1408" stroke-width="9"/>
                <rect x="-62" y="-210" width="124" height="120" rx="8" fill="#ff7a3d"/><circle cx="0" cy="-150" r="34" fill="#ffd23f"/><rect x="-62" y="-130" width="124" height="40" fill="#ff4f5e"/>
                <text y="-30" text-anchor="middle" font-family="Anton" font-size="46" fill="#fff">GAME</text></g></g></g></g>
          <g id="beamG"><rect x="280" y="826" width="520" height="28" rx="14" fill="#e8b84f" stroke="#2a1408" stroke-width="10"/></g>
          <circle cx="540" cy="840" r="30" fill="#d9a441" stroke="#2a1408" stroke-width="10"/>
          <g id="tagL"><rect x="-135" y="-90" width="270" height="190" rx="18" fill="#fffaf0" stroke="#2a1408" stroke-width="8"/>
            <text y="-38" text-anchor="middle" font-family="Anton" font-size="44" fill="#2a1408">ENDGAME</text>
            <text y="4" text-anchor="middle" font-family="Anton" font-size="42" fill="#8a5a3a">WHOLE RUN</text>
            <text y="74" text-anchor="middle" font-family="Anton" font-size="64" fill="#b8243a">$2.8B</text></g>
          <g id="tagR"><rect x="-135" y="-90" width="270" height="190" rx="18" fill="#fffaf0" stroke="#2a1408" stroke-width="8"/>
            <text y="-38" text-anchor="middle" font-family="Anton" font-size="44" fill="#2a1408">GTA VI</text>
            <text y="4" text-anchor="middle" font-family="Anton" font-size="42" fill="#8a5a3a">FIRST DAY</text>
            <text y="74" text-anchor="middle" font-family="Anton" font-size="64" fill="#ff4f5e">$3.79B</text></g></g>
        </g></svg>
      </div>

      <!-- S5 sold before it came out: a locked door and a counter -->
      <div id="s5" class="clip scene" data-start="13.4" data-duration="3.95" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s5cam">
          <rect width="1080" height="1920" fill="url(#plum)"/>
          <g id="dots5"></g>
          <g transform="translate(510 1235)">
            <rect x="-300" y="-70" width="600" height="140" rx="22" fill="#24122f" stroke="#ffd23f" stroke-width="8"/>
            <text id="cd5" y="26" text-anchor="middle" font-family="Anton" font-size="74" fill="#ffd23f">LOCKED UNTIL NOV 19</text>
            <g id="lock5" transform="translate(350 -10)"><path d="M-30 -20 V-50 A30 30 0 0 1 30 -50 V-20" fill="none" stroke="#ffd23f" stroke-width="12"/><rect x="-44" y="-24" width="88" height="74" rx="12" fill="#ffd23f" stroke="#140a1d" stroke-width="6"/></g>
          </g>
        </g></svg>
      </div>

      <!-- S6 the building: someone you know is in one of these windows -->
      <div id="s6" class="clip scene" data-start="17.35" data-duration="3.73" data-track-index="0">
        <svg viewBox="0 0 1080 1920"><g id="s6cam">
          <rect width="1080" height="1920" fill="url(#night)"/>
          <circle cx="880" cy="200" r="70" fill="#fff1c8" opacity=".85"/>
          <rect x="60" y="300" width="960" height="1700" fill="#7a3a2a" stroke="#2a1008" stroke-width="10"/>
          <g id="brick6" stroke="#5e2a1e" stroke-width="4"></g>
          <g id="win6"></g>
          <g id="s6p" transform="translate(540 1020) scale(0.27)"></g>
          <g id="frame6"></g>
          <g id="bills6"></g>
        </g></svg>
      </div>

      <div id="c1" class="clip cap" data-start="0" data-duration="2.88" data-track-index="1" style="top:290px"><span id="c1a" class="ln gold">$3.79 BILLION</span><span id="c1b" class="ln sm">IN ONE DAY?</span><span id="c1c" class="ln xs">GTA 6 · LAUNCH DAY</span></div>
      <div id="c2" class="clip cap" data-start="5.0" data-duration="1.63" data-track-index="1" style="top:300px"><span id="c2a" class="ln box">DAY 1</span><span id="c2b" class="ln xs">GTA 6 · PER ROCKSTAR</span></div>
      <div id="c3" class="clip cap" data-start="7.25" data-duration="2.27" data-track-index="1" style="top:300px"><span id="c3a" class="ln coral">ALMOST 5X</span></div>
      <div id="c4" class="clip cap" data-start="11.0" data-duration="2.4" data-track-index="1" style="top:300px"><span id="c4a" class="ln gold sm">BIGGER THAN</span><span id="c4b" class="ln sm">ALL OF ENDGAME</span></div>
      <div id="c5" class="clip cap" data-start="13.4" data-duration="3.95" data-track-index="1" style="top:300px"><span id="c5a" class="ln gold">1 MILLION</span><span id="c5b" class="ln xs" style="margin-top:26px">COPIES SOLD</span></div>

      <audio id="mix" class="clip" data-start="0" data-duration="21.08" data-track-index="2" data-volume="1" src="assets/mix.wav"></audio>
      <div id="subs"></div>
      <div id="vig"></div>
      <div id="grain"></div>
      <div id="flash"></div>
    </div>

    <script>
      const X = window.XR, T = X.tf, R = X.rand(21);
      document.getElementById("defsHost").outerHTML = X.defs();
      { const st = document.createElement("style"); st.textContent = X.CAP_CSS; document.head.appendChild(st); }
      const w = (s, i) => window.TIMING[s][i];
      const io2 = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
      const s6z = (t) => (t < 19.25 ? 1 + io2(X.clamp((t - 17.35) / 1.9, 0, 1)) : t < 19.3 ? 2 : 2 - 0.6 * io2(X.clamp((t - 19.3) / 1.6, 0, 1)));
      X.captions({ capY: (t) => (t < 2.88 ? 1300 : t < 6.63 ? 1395 : t < 9.52 ? 1420 : t < 13.4 ? 1370 : t < 17.35 ? 1400 : 1030 + 118 * s6z(t) + 22) });

      // ---- shared drawings ----
      const gamepad = (btn) => `
        <path d="M-270 -70 C-270 -140 -210 -160 -120 -160 L120 -160 C210 -160 270 -140 270 -70 C300 50 330 190 258 214 C196 234 160 156 112 104 L-112 104 C-160 156 -196 234 -258 214 C-330 190 -300 50 -270 -70Z" fill="#2b2733" stroke="#120c08" stroke-width="10" stroke-linejoin="round"/>
        <path d="M-240 -110 C-200 -140 -150 -140 -110 -138" fill="none" stroke="#fff" stroke-width="8" opacity=".18" stroke-linecap="round"/>
        <g transform="translate(-160 -50)"><rect x="-20" y="-60" width="40" height="120" rx="8" fill="#14111a"/><rect x="-60" y="-20" width="120" height="40" rx="8" fill="#14111a"/></g>
        <g transform="translate(160 -50)" fill="${btn}" stroke="#120c08" stroke-width="5"><circle cx="0" cy="-46" r="22"/><circle cx="46" cy="0" r="22"/><circle cx="0" cy="46" r="22"/><circle cx="-46" cy="0" r="22"/></g>
        <circle cx="-80" cy="50" r="44" fill="#14111a" stroke="#4a4458" stroke-width="8"/><circle cx="80" cy="50" r="44" fill="#14111a" stroke="#4a4458" stroke-width="8"/>
        <rect x="-36" y="-110" width="72" height="18" rx="9" fill="${btn}" opacity=".9"/>`;
      const bill = (id, s = 1) => `<g id="${id}"><g transform="scale(${s})"><rect x="-95" y="-45" width="190" height="90" rx="8" fill="url(#billG)" stroke="#1f4d22" stroke-width="5"/>
        <rect x="-80" y="-32" width="160" height="64" rx="4" fill="none" stroke="#2f7a34" stroke-width="3"/><circle r="26" fill="#d8f7cf" stroke="#2f7a34" stroke-width="4"/>
        <text y="15" text-anchor="middle" font-family="Anton" font-size="40" fill="#2f7a34">$</text></g></g>`;

      // S1
      let rays = ""; for (let i = 0; i < 20; i++) { const a0 = i / 20 * 6.283, a1 = (i + 0.5) / 20 * 6.283;
        rays += `<path d="M540 1010 L${540 + Math.cos(a0) * 2000} ${1010 + Math.sin(a0) * 2000} L${540 + Math.cos(a1) * 2000} ${1010 + Math.sin(a1) * 2000}Z" fill="#fff6c0"/>`; }
      X.put("rays1", rays);
      X.put("pad1", gamepad("#ff5a3c"));
      const NB = 30, B1 = [];
      for (let i = 0; i < NB; i++) { const b = { a: -Math.PI / 2 + (R() - 0.5) * 2.9, v: 0.7 + R() * 0.6, ph: R(), spin: (R() - 0.5) * 2.4, s: 0.75 + R() * 0.55, back: i % 3 === 0 };
        B1.push(b); X.put(b.back ? "bills1back" : "bills1", bill(`b1_${i}`, b.s)); }
      let pile = ""; for (let r = 0; r < 4; r++) for (let c = 0; c < 7; c++) { const x = 60 + c * 150 + (r % 2) * 70 + (R() - 0.5) * 30, y = 1880 - r * 70 + (R() - 0.5) * 16;
        pile += `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)}) rotate(${((R() - 0.5) * 16).toFixed(1)})"><rect x="-90" y="-36" width="180" height="72" rx="6" fill="#7fcf7a" stroke="#1f4d22" stroke-width="5"/><rect x="-24" y="-38" width="48" height="76" fill="#f3e9c6" stroke="#1f4d22" stroke-width="4"/></g>`; }
      X.put("pile1", pile);

      // S2
      const gamer = { skin: "#c98a5e", skinD: "#a56a44", hair: "#1d120b", hairStyle: "curly", shirt: "#ff7a3d", iris: "#3a2414" };
      X.put("s2p", X.person("g2", 1, gamer));
      X.put("pad2", `<g transform="scale(.62)">${gamepad("#7ff6ff")}</g>`);

      // S3
      let gr = ""; for (let y = 788; y <= 1480; y += 92) gr += `<path d="M120 ${y} H900"/>`; for (let x = 120; x <= 900; x += 130) gr += `<path d="M${x} 788 V1480"/>`;
      X.put("grid3", gr);
      const HMAX = 640, HL = HMAX * 0.8 / 3.79;
      let sg = ""; for (let k = 1; k <= 4; k++) sg += `<path id="sg${k}" d="M572 ${1480 - HL * k} H848" opacity="0"/>`;
      X.put("seg3", sg);

      // S4 tickets + popcorn on the left pan
      let tix = "";
      for (let i = 0; i < 16; i++) { const x = -130 + (i % 6) * 48 + (R() - 0.5) * 20, y = -18 - Math.floor(i / 6) * 34 - (R() * 10), r = (R() - 0.5) * 40;
        tix += `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)}) rotate(${r.toFixed(0)})"><rect x="-44" y="-20" width="88" height="40" rx="5" fill="${i % 2 ? "#ffd23f" : "#ff8a7a"}" stroke="#2a1408" stroke-width="5"/><path d="M-20 -20 V20" stroke="#2a1408" stroke-width="3" stroke-dasharray="5 5"/></g>`; }
      tix += `<g transform="translate(70 -110)"><path d="M-60 -70 L60 -70 L46 80 L-46 80Z" fill="#fffaf0" stroke="#2a1408" stroke-width="8" stroke-linejoin="round"/>
        <path d="M-36 -70 L-28 80 M0 -70 V80 M36 -70 L28 80" stroke="#e23a3a" stroke-width="14"/>
        ${[...Array(7)].map((_, k) => `<circle cx="${-52 + k * 17}" cy="${-78 - (k % 2) * 16}" r="20" fill="#fff4c8" stroke="#2a1408" stroke-width="5"/>`).join("")}</g>`;
      X.put("tix", tix);

      // S5 dots: 20 x 26 preorder tickets that light up as the counter rises
      const COLS = 20, ROWS = 18, D5 = [], ord = [];
      let dots = ""; for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const i = r * COLS + c; ord.push(i);
        dots += `<rect id="d5_${i}" x="${150 + c * 39}" y="${590 + r * 28}" width="28" height="18" rx="4" fill="#ffd23f" opacity=".12"/>`; }
      for (let i = ord.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [ord[i], ord[j]] = [ord[j], ord[i]]; }
      const rank = []; ord.forEach((d, k) => (rank[d] = k / ord.length));
      X.put("dots5", dots);

      // S6 building: 3 x 5 windows, the friend in the middle one
      let br = ""; for (let y = 330; y < 1920; y += 44) { br += `<path d="M60 ${y} H1020"/>`; for (let x = 60 + ((y / 44) % 2) * 50; x < 1020; x += 100) br += `<path d="M${x} ${y} V${y + 44}"/>`; }
      X.put("brick6", br);
      const WX = [250, 540, 830], WY = [430, 730, 1030, 1330, 1630], WW = 230, WH = 200, WIN = [];
      let wn = "", fr = "";
      WY.forEach((y, r) => WX.forEach((x, c) => { const i = r * 3 + c, me = r === 2 && c === 1;
        WIN.push({ i, x, y, me, hue: R(), ph: R() * 6 });
